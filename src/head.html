<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Waves">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="assets/manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<title>xmb-waves</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; -webkit-user-select: none; user-select: none; }
  /* the picture: placed and sized by the Picture settings (see layout() in the script) */
  #c { display: block; position: fixed; left: 0; top: 0; }
  /* the round settings button: a menu icon while the panel is closed, a close icon while it is open */
  #gear { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); z-index: 3;
    width: 40px; height: 40px; border-radius: 20px; border: 0; padding: 0; background: rgba(10, 12, 18, .55); color: #fff;
    opacity: 0; transition: opacity .4s; cursor: pointer; display: grid; place-items: center;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  body.active #gear, #gear.open, #gear:focus-visible { opacity: .9; }
  #gear svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  #gear .ic-close, #gear.open .ic-menu { display: none; }
  #gear.open .ic-close { display: block; }
  /* the side panel: floats over the picture, scrolls, collapsible sections */
  #panel { position: fixed; top: 0; right: 0; bottom: 0; z-index: 2; width: min(330px, calc(100vw - 24px)); box-sizing: border-box;
    padding: max(8px, env(safe-area-inset-top)) 12px calc(max(12px, env(safe-area-inset-bottom)) + 56px) 12px;
    overflow-y: auto; overscroll-behavior: contain; display: none;
    font: 13px/1.45 system-ui, sans-serif; color: #eee; background: rgba(10, 12, 18, .66);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  #panel.open { display: block; }
  #panel details { border-top: 1px solid rgba(255, 255, 255, .12); }
  #panel summary { cursor: pointer; padding: 8px 0; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 8px; }
  #panel summary::-webkit-details-marker { display: none; }
  #panel summary::before { content: ''; width: 6px; height: 6px; margin-left: 2px; border-right: 2px solid #ccc; border-bottom: 2px solid #ccc;
    transform: rotate(-45deg); transition: transform .15s; }
  #panel details[open] > summary::before { transform: rotate(45deg); }
  #panel .body { padding: 0 0 10px; }
  #panel .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; flex-wrap: wrap; }
  #panel .row .lbl { flex: 0 0 100px; color: #bbb; }
  #panel .row .ctl { flex: 1 1 auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
  #panel .note, #panel .hint { color: #9a9a9a; font-size: 12px; margin: -2px 0 6px; }
  #panel .note { margin-left: 108px; }
  #panel h4 { margin: 12px 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #9ab; }
  #panel .seg { display: inline-flex; flex-wrap: wrap; gap: 2px; }
  #panel .seg button { background: rgba(255, 255, 255, .08); color: #ddd; border: 0; border-radius: 6px; padding: 3px 8px; font: inherit; cursor: pointer; }
  #panel .seg button.on { background: #e8e8f0; color: #111; }
  #panel .btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  #panel .btns button, #panel button.act { background: rgba(255, 255, 255, .12); color: #eee; border: 0; border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
  #panel .btns button:hover, #panel button.act:hover, #panel .seg button:hover { background: rgba(255, 255, 255, .22); }
  #panel .seg button.on:hover { background: #fff; }
  #panel .btns button:disabled { opacity: .4; cursor: default; }
  #panel label.chk { display: flex; align-items: center; gap: 8px; margin: 4px 0; cursor: pointer; }
  #panel input[type=range] { flex: 1 1 70px; min-width: 50px; margin: 0; }
  #panel input[type=number], #panel input[type=datetime-local], #panel select { font: inherit; font-size: 12px; background: rgba(0, 0, 0, .35);
    color: #eee; border: 1px solid rgba(255, 255, 255, .2); border-radius: 4px; padding: 2px 4px; max-width: 100%; }
  #panel input[type=number] { width: 66px; }
  #panel .param .lbl { font-size: 12px; }
  #panel .param.follow input[type=range] { opacity: .5; }
  #panel .param .reset { background: none; border: 0; color: #bbb; cursor: pointer; padding: 0 3px; font: inherit; font-size: 15px; line-height: 1; }
  #panel .param .reset:disabled { opacity: .25; cursor: default; }
  #panel .val { min-width: 40px; color: #ddd; }
  #panel pre.out { font: 11px/1.4 ui-monospace, monospace; white-space: pre-wrap; margin: 4px 0; color: #cfd; }
  /* the frame-rate counter overlay */
  #fps { position: fixed; left: max(8px, env(safe-area-inset-left)); top: max(8px, env(safe-area-inset-top)); z-index: 2; display: none;
    font: 12px/1.3 ui-monospace, monospace; color: #fff; background: rgba(0, 0, 0, .45); padding: 5px 7px; border-radius: 5px; }
  #fps.on { display: block; }
  #fps canvas { display: block; margin-top: 4px; width: 120px; height: 28px; }
  #fps pre { margin: 4px 0 0; font: inherit; white-space: pre; }
  #fps div[hidden], #fps canvas[hidden], #fps pre[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fps"><div id="fpsText"></div><canvas id="fpsGraph" width="120" height="28"></canvas><pre id="stats"></pre></div>
<aside id="panel" aria-label="settings"></aside>
<button id="gear" aria-label="settings" aria-expanded="false">
  <svg class="ic-menu" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  <svg class="ic-close" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
</button>
<script>
