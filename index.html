<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; -webkit-user-select: none; user-select: none; }
  /* the picture: placed and sized by the Picture settings (see layout() in the script) */
  #c { display: block; position: fixed; left: 0; top: 0; }
  /* the round settings button: a menu icon while the panel is closed, a close icon while it is open */
  #gear { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); z-index: 3;
    width: 40px; height: 40px; border-radius: 20px; border: 0; padding: 0; background: rgba(10, 12, 18, .55); color: #fff;
    opacity: 0; transition: opacity .4s; cursor: pointer; display: grid; place-items: center;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  body.active #gear, #gear.open, #gear:focus-visible { opacity: .9; }
  #gear svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  #gear .ic-close, #gear.open .ic-menu { display: none; }

  /* the side panel: floats over the picture, scrolls, collapsible sections */

    overflow-y: auto; overscroll-behavior: contain; display: none;
    font: 13px/1.45 system-ui, sans-serif; color: #eee; background: rgba(10, 12, 18, .66);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  #panel.open { display: block; }
  #panel details { border-top: 1px solid rgba(255, 255, 255, .12); }
  #panel summary { cursor: pointer; padding: 8px 0; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 8px; }
  #panel summary::-webkit-details-marker { display: none; }
  #panel summary::before { content: ''; width: 6px; height: 6px; margin-left: 2px; border-right: 2px solid #ccc; border-bottom: 2px solid #ccc;
    transform: rotate(-45deg); transition: transform .15s; }
  #panel details[open] > summary::before { transform: rotate(45deg); }
  #panel .body { padding: 0 0 10px; }

    color: #eee; border: 1px solid rgba(255, 255, 255, .2); border-radius: 4px; padding: 2px 4px; max-width: 100%; }
  #panel input[type=number] { width: 66px; }

  #fps { position: fixed; left: max(8px, env(safe-area-inset-left)); top: max(8px, env(safe-area-inset-top)); z-index: 2; display: none;

  #fps.on { display: block; }
  #fps canvas { display: block; margin-top: 4px; width: 120px; height: 28px; }

<body>
<canvas id="c"></canvas>
<div id="fps"><div id="fpsText"></div><canvas id="fpsGraph" width="120" height="28"></canvas><pre id="stats"></pre></div>
<aside id="panel" aria-label="settings"></aside>
<button id="gear" aria-label="settings" aria-expanded="false">
  <svg class="ic-menu" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  <svg class="ic-close" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
</button>
<script>
// Simulation module: the wave's spring net, its free-form deformation, and the
// sparkle pool. Pure JavaScript with no DOM access, so the same source runs in a
// Web Worker (normal mode) and on the main thread (deterministic score mode).
function XMBW_SIM() {
  'use strict';
  const N = 19;            // control grid, N x N points
  const DT = 1 / 60;       // fixed step
  const H = 1 / (N - 1);   // grid spacing in net units (the net is a unit square)

  // ---- tunables (all original design values) ----
  const NET = {
    kStruct: 0.3119, kBend: 2.247,    // spring constants along the length (unit masses); the bending springs are much
                                    // stiffer than the direct ones (eight times; spec 17)
    alongRest: 1.0,                 // rest length of the along-springs relative to the grid spacing: 1.0 keeps the
                                    // sheet smooth; above 1 the slack buckles into standing wrinkles (wirier than the reference)
    acrossK: 0.8382,                 // the across-the-width springs are comparable to the along ones (a little stiffer); with the
                                    // stiffer bending springs this makes the picture hold together longer from second to second
    damping: 0.000139,              // fraction of velocity removed per step: light, a decay time of 120 s, two cycles of the
                                    // slower drive motion (spec 14); folds launched at the shaken end still travel at the free end
    noise: 9.6e-5,                  // velocity kick per step (std dev). Besides keeping the motion alive, the kicks set how
                                    // many strands the band shows: the across-the-width springs have no linear stiffness at
                                    // rest length, so the kicks drive neighbouring rows apart into separate strands; 2e-5 gives a broad
                                    // ribbon of two or three layers whose lines stand too high above the band; much larger values
                                    // make the net jitter and the fold lines stipple. From the settled start (below) the net's own
                                    // agitation is what it is in equilibrium rather than what the flat start left behind, so this
                                    // sits as high as the check of 4.4e allows: the nudge-driven speed of the free half is then
                                    // 1.9 times the shaken edge's peak speed (tools/measure/nudgecheck.js; the spec asks for
                                    // within a factor of two)
    push: 0.012,                    // steady gentle pull on the free end, along the length, so the sheet stays extended
    // the drive (spec 14 and 18): smooth and unhurried, each end moving less than a grid spacing (0.056), up-and-down travel
    // clearly larger than the towards-and-away (5:3), which is the faster motion; the damping outlasts two cycles of the
    // slower motion. Nothing on screen shows the drive's own rate (spec 18), so it is set from those relative statements.
    // Spec 22: with the depth offset across the edge at 2.5 times the height offset (as before) the shared path coiled every
    // column of the net into a scroll of two to three turns, seen as one solid tube with a broad sheen and two lines; with
    // the offsets close ("somewhat more", spec 8) and the path a little larger, the sheet folds over itself gently instead
    driveA: 0.05, driveW1: 0.1047,   // driven end: height amplitude, angular frequency (a 60 s cycle)
    driveB: 0.03, driveW2: 0.1571,   // driven end: depth amplitude, angular frequency (a 40 s cycle)
    drivePhase1: 0.55, drivePhase2: 0.78,  // phase change per row for height and depth: the driven points are strung out along the
                                          // shared path (1.58 cycles across the edge in height, 2.23 in depth); the depth offset builds up more
                                          // than the height offset, and that difference between the axes is what makes the folds cross.
                                          // Spec 26: this is how much of the width's slack is folded, and it is the lever on the band's
                                          // substance rather than a larger or faster drive (the amplitudes and rates are untouched, so the
                                          // shaken edge's peak speed and the surface's speed on screen are too). At 1.28 / 1.58 cycles the
                                          // settled net showed 3.4 peaks and 0.44 partings a column against the footage's 4.1 and 0.75
    driveEase: 0.02,                // easing of the driving clock towards sim time
    // envelope along the length (spec 17, 18): fullest near the shaken end, falling to envLow by the mood's crossover, with a
    // dip of envDip (width envWidth) just past it; moderate and nearly even over the rest, which includes all that is visible.
    // It scales the net's height and depth coordinates about one fixed axis along the length (height 0, depth envAxis: the
    // centre line of the shared driven path), a plain scaling of the shape the net has reached; no rest grid takes part.
    // It does not change the net's motion, so it is not part of the stored state's key
    envLow: 0.95, envDip: 0.15, envWidth: 0.08, envAxis: 0.5,
    warm: 6000,                     // warm-up steps before frame 0, at least. Without a stored state the lightly damped net
                                    // needs several decay times to settle into its running state from the flat start, so the
                                    // warm-up runs warmDecays of them (the first warmSettle steps with heavy damping).
                                    // Spec 26: a changed sheet needs a new warm-up, far longer than three decay times. From the
                                    // flat start the net's own motion still eases off until about 700 s of simulation (its typical
                                    // point speed falls from 1.5e-2 at 400 s to 1.1e-2, and the path it follows along its length
                                    // from 1.27 to 1.15 of the straight line); eight decay times (1000 s) is past that, and the
                                    // checks of 4.4a have stopped trending there (tools/measure/settlecheck.js)
    warmSettle: 1500, warmDecays: 8,
    warmNet: 3600,                  // from the stored state: the net alone for this many steps, then 900 full steps (fixed)
  };
  // Free-form deformation lattice: more cells along the length than across or in depth. Across the width (nw) there are
  // enough cells for the one-cycle twist (spec 18): 7 spans over the lattice's width, about six control values per cycle
  // (with 4 cells there was one span, and the twist's samples, 1.2 apart, aliased into a slow ramp)
  const LAT = { nu: 10, nv: 4, nw: 10,
    spread: 5.614,                    // uneven layout along the length: the cells at the free end are this many times longer than
                                    // at the shaken end (fixed), so the free end of the net covers far more of the scene
    // The vertical displacement is the sum of four slow parts, computed directly from the clock (rates in rad/s). The rates
    // were fitted (spec 18) to the original's 1 s and 5 s picture correlation, the share of the band's motion at its quick
    // and slow ends, the partings' lifetimes, the swell's crossing and the tilt's period (22 s in the footage), measured the
    // same way on the footage and on renders at 23 moments; periods: swell 21 s, twist 22 s, bob 70 s, bump 113 s (the
    // swell's strength 102 s):
    // a wave rolling from the shaken end to the free end, growing along the length, whose strength swells and fades.
    // It is the swell: its crest crossing the screen is the band's slow left-to-right rise and fall
    // (spec 26: its strength changes appreciably within the time one crest takes to cross the screen. The crest advances
    // rollW / (2 pi rollWaves) = 0.032 of the length a second; the strength's own period is 31 s, so no two crossings are
    // alike. At the earlier 102 s the strength only crept while a crest travelled and the picture 5 s on was too exactly
    // the reverse of the picture now.)
    // Spec 30 fits the rate and the wavelength against two observables, not one, measured the same way on the footage
    // and on renders (tools/measure/swelllag.py: the band's height in six bands of columns, the lag that lines the two
    // outer bands up, and their correlation at no lag). On the original's two 30 s recordings the crest crosses in 11.0
    // and 11.5 s with the no-lag correlation -0.54 and -0.82; at rollWaves 1.141 and rollW 0.3 this build crossed in
    // 7.9-8.2 s with -0.37 to -0.39, which is the wavelength too long and not the clock too fast. At 1.40 and 0.285 it
    // crosses in 10.6 s with -0.68
    rollAmp: 0.05, rollGrow: 2.664, rollWaves: 1.40, rollW: 0.285, rollMod: 0.35, rollModW: 0.2,
    // one soft hump sliding back and forth along the length (centre and travel as fractions of the length; part of
    // its travel lies beyond the shaken end, and over the rest it passes over every part of the sheet, including the
    // part at the right of the screen, which the free end reaches (spec 26))
    bumpAmp: 0.10754, bumpWidth: 0.25, bumpCentre: 0.3, bumpTravel: 0.72, bumpW: 0.01118,
    // the whole sheet rising and falling together, much more slowly than the swell. Spec 26: the bob is the main carrier
    // of the band's slow wandering over minutes, so it moves the band by more than the bump does.
    // Spec 30: the band's course over times since the start had the right shape with too little reach (0.46 to 0.60 H
    // over the twelve times the footage covers, against the original's 0.41 to 0.70), which is the slow parts' size and
    // not the camera's aim, so the two sizes and the two rates were fitted with the ceiling below and the phases, all
    // together, against the whole course (tools/measure/coursefit.js), and the aim only afterwards. A slow part's share
    // of how fast the band moves is its amplitude times its rate, and that was already right, so the fit was held to
    // candidates no quicker than the old values in either part: the bob is half as large again and half as slow again,
    // the bump a tenth larger and five times slower. The ordering of 4.4b holds and is wider than before: swell 21 s,
    // twist 21.7 s, bob 100 s, bump 612 s, the bob well inside 4.6's "over minutes"
    bobAmp: 0.06863, bobW: 0.06301,
    twistAmp: 0.04, twistW: 0.29,  // a gentle ripple, one cycle across the width, travelling across it
    // the four parts' phases at clock 0 (spec 18: fixed, the same at every start, never drawn per run): swell strength, bump,
    // bob, swell, twist. Spec 30 says not to fit these on their own to bring single moments into line, so they are no
    // longer fitted after the rates: they are searched together with the two slow sizes, the two slow rates and the
    // clock's ceiling against the band's whole course (the twelve times since the start the footage covers, 40 s to 30
    // minutes; the original's band is at the same height at a given time since the start whatever the date, so the four
    // noise conditions give one course, their spread per time being 0.008 to 0.021 H). Against it the joint fit is
    // 0.054 H rms where the old values were 0.085
    ph: [1.36874, 5.49293, 6.01757, 6.26961, 2.85385],
    // The clock every part of the warp reads is not unbounded (spec 30): it runs up to this ceiling, in seconds, and
    // restarts from its starting value, and because all four parts read it directly they jump together. The driven end
    // reads the same clock through the easing of NET.driveEase, so it is not set down at a new place: it is swept along
    // its usual path over about a second (the easing's time constant), which throws a real disturbance into the sheet
    // that then travels and dies away like any other. The ceiling is fitted with the rates and the sizes against the
    // band's height over times since the start (tools/measure/coursefit.js)
    // (2400 s: of 900, 1200, 1800, 2400 and no restart inside the footage's window at all, each with its own joint fit
    // of the rates, the sizes and the phases, 2400 s fitted the course best, 0.059 H rms before the aim and 0.040 after
    // it, against 0.080 for both 900 and 1800. It puts the restart 1326 s after a start, so a 10 s clip contains one
    // about once in 240.)
    clockMax: 2400,
  };
  // Scene mapping of the deformed net (scene units; x along the length, y up, z away).
  const SCENE = { len: 15, x0: 0.9, wid: 6.0, height: 3.5, y0: 0.05, z0: 0.0, tilt: 0.0 }; // tilt: rise per unit length towards the near end
  // x0: where the sheet sits along its own length in the scene, which is what sets the framing of 4.4d. Spec 30: the
  // band must thin, pinch and dim as it leaves the picture at the free-end edge, because the sheet's own end is there
  // and the fade it carries (4.4c) is already biting inside the picture. At 1.9 the free end lay 0.26 of the frame's
  // width beyond the right edge and the band left the picture at full strength: over the 38 recordings and renders the
  // band's mean light in the free-end tenth of the width was 1.27 times its light in the middle third, where the
  // footage's is 0.59 (tools/measure/freeend.py). At 0.9 the free end reaches screen x 1.12 and the ratio is 0.63; at
  // 0.4 (screen x 1.04) it fell to 0.42, past the original's. The band's thickness in that tenth is 1.01 of the middle
  // third's against the footage's 1.05
  // wid, height (spec 22, refitted for spec 26): the scales of the net's gathered width and of its height into the scene. The net
  // is bunched across its width (one shared driven path), so at wid 4.7 the visible surface spanned less depth down a screen
  // column than from left to right: a strip. At 6 the depth across the band is many times the change along the screen and the
  // far width shows. Both scale the net and the drive together (the drive is in net units), so lowering them from 7 and 4.1
  // slows everything on screen in proportion, as spec 26 asks: it brought the band's thickness from 0.185 to 0.151 H (footage
  // 0.151), the flow's vertical speed from 20.3 to 17.9 px/s (15.6) and its light over the background from 38.4 to 37.2 (36.5)

  const SPARK = {
    pool: 2000,
    // births (spec 16): bursts on a large share of the steps, each a fixed batch at random points of the sheet, supply nearly
    // all of them; a single walker leaves a trail along the length, one sparkle every other step, and its births come after
    // the bursts' so they are the ones dropped once the pool is full
    burstP: 0.6, burstN: 12,
    walkers: 1, walkerP: 0.02, walkMin: 40, walkMax: 220, walkStep: 0.045, // patches per step
    cone: 0.6, reverseP: 0.12,                      // cone: half-angle (rad) of the birth cone, deviation spread evenly up to it
    speedK: 0.25, speedPow: 0.5, speedMin: 0.033, // scene units / s: on screen about as fast as the band's lines rise and fall
    rateMean: 1 / 6.5, rateSpread: 0.30, rateMin: 1 / 14, // life per second
    rampIn: 0.025, rampOut: 0.045,                    // short linear ramps of the life (fraction), the fade-in the quicker
    // jitter (spec 25): the push, one value per axis, is mostly redrawn every step, but the share jitterHeld of its
    // strength is drawn once at birth and never changes, so a sparkle's average push is not quite zero: shimmer about a
    // straight course with a slow one-way bend building up over a long life. Gravity and friction are weak
    jitter: 0.05, jitterHeld: 0.15, gravity: 0.0002, friction: 0.03,  // per second units
    // spin (spec 17): the same schedule over every sparkle's life: angular velocity per axis = spinA x
    // sin(2 pi x spinCycles[axis] x life fraction + spinPhase[axis])
    spinA: 4.0, spinCycles: [0.9, 1.4, 0.6], spinPhase: [0.3, 2.1, 4.0],
    // the bounding box: more generous across the width and in depth than along the length, and (spec 25) no farther
    // outside the picture than it has to be, so a sparkle that has left the picture does not hold its slot for the rest
    // of its life. Along the length the faces sit just beyond the farthest a sparkle inside the picture ever reaches
    // (measured with tools/measure/sparkpool.js), so the fade below is still never seen on screen
    box: [[-4.4, 6.6], [-6, 6], [-3.5, 9]],
    boxFade: 0.30,                                  // sparkles fade out over this distance from the box's faces
  };
  const SPARK_STRIDE = 11; // prev xyz, cur xyz, facing xyz, opacity, random

  function mulberry(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0; let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash32(a) {
    a |= 0; a = (a ^ 61) ^ (a >>> 16); a = Math.imul(a, 9); a ^= a >>> 4;
    a = Math.imul(a, 0x27d4eb2d); a ^= a >>> 15; return a >>> 0;
  }

  // Uniform cubic B-spline basis and derivative.
  function bsp(t, out) {
    const t2 = t * t, t3 = t2 * t, u = 1 - t;
    out[0] = u * u * u / 6; out[1] = (3 * t3 - 6 * t2 + 4) / 6;
    out[2] = (-3 * t3 + 3 * t2 + 3 * t + 1) / 6; out[3] = t3 / 6;
    return out;
  }

  // Live tuning from the settings menu: values maps dotted paths into the tunables
  // above ('NET.kStruct', 'LAT.rollW', ...) to numbers. Only a number that
  // already exists is set, so a stale or mistyped key does nothing. Sizes fixed at
  // creation (the pool, the lattice cells, the walker count) are not tunable.
  const TUNABLES = { NET, LAT, SCENE, SPARK };
  // Settled starting state of the net, written by tools/mkstate.js from this simulation's own run (positions and

const VS_QUAD = `#version 300 es
out vec2 vUv;

// Background gradient for this frame, into a small target (spec 19, 28). Day images: each month's image on its own is
// converted to hue, saturation and value; the value is scaled by the daylight factor, by the two lights (a sun-like spot
// whose centre goes round an oval larger than the frame, and a band along the bottom edge whose centre is the spot's
// mirrored, both driven by one angle of the warped hour) and by the clock's shaping down the frame (late evening and small
// hours: the day image fading away up the frame, its colour deepening towards the top on a clock of its own); lit areas are
// paler and the middle of the month less saturated. The two months' processed images are then mixed (next month's rising
// from the bottom). Night images: mixed for the month, then scaled in brightness only, lit by the same two lights on an
// unwarped clock, under a time envelope, shaped up the frame by their own clock and held above a floor applied last to
// all of that (spec 33). Even at full night weight the picture is a mix of the night image and the day image. All three
// falls up the frame use the one rate in the height (spec 33); only their clocks differ.
const GLSL_BGLIGHT = `
uniform vec4 uOval;   // spot: centre x amplitude, centre y amplitude (its centre is on the top edge at angle 0), radii x, y
uniform vec4 uBand;   // bottom glow: centre x amplitude, half-width, centre height (a little above the bottom edge), half-height
uniform vec2 uLStr;   // the lifts of the spot and the bottom glow (a light lifts its area towards the image's own value)
uniform vec2 uBandWide; // how much the glow's half-width broadens about the middle of the light's day, and how narrow that window is
// the total lift of the two soft lights for angle a (0: the spot's centre on the top edge, the glow at mid-width): the two
// lifts add, with nothing taken off where they overlap (spec 23)
float lights(vec2 uv, float a){
  vec2 s = vec2(0.5 + uOval.x * sin(a), 1.0 - uOval.y * (1.0 - cos(a)));
  vec2 ds = (uv - s) / uOval.zw;
  float aw = a / uBandWide.y;
  float bw = uBand.y * (1.0 + uBandWide.x * exp(-aw * aw));   // a narrow window about the middle of the day (spec 28)
  float gx = (uv.x - (0.5 - uBand.x * sin(a))) / bw, gy = (uv.y - uBand.z) / uBand.w;
  return uLStr.x * exp(-dot(ds, ds)) + uLStr.y * exp(-gx * gx - gy * gy);
}`;
const FS_BGGEN = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uImg, uPrev; uniform float uTiles, uA, uB, uMc, uMw, uNight, uNightMix, uDaylight, uEase;
uniform float uAday, uAnight, uBase, uPale, uMidSat, uFallV, uRiseS, uSatCeil, uNightBase, uNightEnv, uNightFloor, uNightFall;
${GLSL_BGLIGHT}
vec3 img(float idx, vec2 uv){
  vec2 q = vec2(uv.x, (idx + clamp(uv.y, 0.5 / ${BG_H}.0, 1.0 - 0.5 / ${BG_H}.0)) / uTiles);
  return texture(uImg, q).rgb;
}
vec3 rgb2hsv(vec3 c){
  vec4 K = vec4(0.0, -1.0 / 3.0, 2.0 / 3.0, -1.0);
  vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
  vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
  float d = q.x - min(q.w, q.y);
  return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + 1e-10)), d / (q.x + 1e-10), q.x);
}
vec3 hsv2rgb(vec3 c){ vec3 p = abs(fract(c.xxx + vec3(1.0, 2.0 / 3.0, 1.0 / 3.0)) * 6.0 - 3.0); return c.z * mix(vec3(1.0), clamp(p - 1.0, 0.0, 1.0), c.y); }
// one month's day image, processed on its own (L: the lights here; y: the height up the frame). The shaping down the frame
// is proportional in the height (spec 28): every further step up takes away the same share of the value, so what survives
// falls off geometrically and the bottom row is never touched. The saturation is raised by that same fall read the other
// way up (spec 33): the raise above the bottom row's level is what the fall takes away, so it is smallest at the bottom
// edge, grows as the fall dies away and levels off towards a ceiling (1 + uSatCeil) near the top of the frame rather than
// growing without limit. Both fall off at the one rate in the height, differing only in the clock that drives them
// (uFallV, uRiseS: that rate times each clock). The raise is not held back at the pure end - past a pure hue the colour
// swings to the strongest primary (the negative channels hsv2rgb then gives are cut at zero), so the hue itself turns.
vec3 processDay(vec3 c, float L, float y){
  vec3 h = rgb2hsv(c);
  h.z *= uDaylight * min(1.0, uBase + L) * exp(-uFallV * y);
  h.y = max(0.0, h.y * (1.0 - uPale * L)) * (1.0 - uMidSat) * (1.0 + uSatCeil * (1.0 - exp(-uRiseS * y)));
  return max(hsv2rgb(h), vec3(0.0));
}
void main(){
  vec2 uv = vUv; // y = 0 at the bottom
  vec2 iu = vec2(uv.x, 1.0 - uv.y); // image rows are stored top first
  // next month's images rise from the bottom: a soft S-shaped step down the screen, centre uMc, half-width uMw
  float f = smoothstep(-1.0, 1.0, (uMc - uv.y) / uMw);
  float L = lights(uv, uAday);
  vec3 day = mix(processDay(img(uA * 2.0, iu), L, uv.y), processDay(img(uB * 2.0, iu), L, uv.y), f);
  float Ln = lights(uv, uAnight);
  // the night level: the envelope times the two lights, shaped up the frame by the one rate in the height on its own
  // clock, and the floor applied last to the whole of that (spec 33), so wherever the floor binds the night picture is
  // flat from the bottom edge to the top and the shaping cannot act below it
  vec3 night = mix(img(uA * 2.0 + 1.0, iu), img(uB * 2.0 + 1.0, iu), f)
    * max(uNightFloor, uNightEnv * min(1.0, uNightBase + Ln) * exp(-uNightFall * uv.y));
  vec3 c = mix(day, night, uNight * uNightMix);
  vec3 prev = texture(uPrev, vUv).rgb;
  o = vec4(mix(prev, c, uEase), 1.0);
}`;

// Wave: bicubic B-spline surface over the control net, shaded per vertex in the projected space. Every surface cell is
// drawn as its own small quad (six vertices). A cell thinner than a pixel is not widened (spec 17): it lights only the
// supersamples it covers, and with the size factor its light is faint anyway.
const VS_WAVE = `#version 300 es
precision highp float;
uniform highp sampler2D uNet0, uNet1; uniform float uAlpha;
uniform mat4 uVP; uniform int uSA, uSV;
uniform vec3 uCam, uRight, uUp, uFwd; uniform vec2 uProj; uniform float uSizeNorm;
out float vCos, vSize; out vec2 vST;
vec3 cp(ivec2 ij){ return mix(texelFetch(uNet0, ij, 0).xyz, texelFetch(uNet1, ij, 0).xyz, uAlpha); }
void basis(float t, out vec4 b, out vec4 d){
  float t2 = t * t, t3 = t2 * t, u = 1.0 - t;
  b = vec4(u * u * u, 3.0 * t3 - 6.0 * t2 + 4.0, -3.0 * t3 + 3.0 * t2 + 3.0 * t + 1.0, t3) / 6.0;
  d = vec4(-u * u, 3.0 * t2 - 4.0 * t, -3.0 * t2 + 2.0 * t + 1.0, t2) * 0.5;
}
void main(){
  int cell = gl_VertexID / 6, v = gl_VertexID - cell * 6;
  int i = cell % uSA, row = cell / uSA;
  int cs = (v == 1 || v == 3 || v == 4) ? 1 : 0, ct = (v == 2 || v == 4 || v == 5) ? 1 : 0;
  float s = float(i + cs) / float(uSA) * ${NN - 3}.0, t = float(row + ct) / float(uSV) * ${NN - 3}.0;
  int is_ = min(int(floor(s)), ${NN - 4}), it = min(int(floor(t)), ${NN - 4});
  vec4 bs, ds, bt, dt; basis(s - float(is_), bs, ds); basis(t - float(it), bt, dt);
  vec3 P = vec3(0.0), Ps = vec3(0.0), Pt = vec3(0.0);
  for (int b = 0; b < 4; b++) {
    vec3 rb = vec3(0.0), rd = vec3(0.0);
    for (int a = 0; a < 4; a++) { vec3 c = cp(ivec2(is_ + a, it + b)); rb += bs[a] * c; rd += ds[a] * c; }
    P += bt[b] * rb; Ps += bt[b] * rd; Pt += dt[b] * rb;
  }
  // shading per vertex, in the projected space: view axes scaled by the projection (x by f / aspect, y by f), before
  // the perspective divide. The B-spline commutes with this linear map, so the surface, its derivatives and their
  // unnormalised cross product (its length the element's area there) are those of the projected surface.
  vec3 D = P - uCam;
  vec3 Q = vec3(uProj.x * dot(uRight, D), uProj.y * dot(uUp, D), dot(uFwd, D));
  vec3 Qs = vec3(uProj.x * dot(uRight, Ps), uProj.y * dot(uUp, Ps), dot(uFwd, Ps));
  vec3 Qt = vec3(uProj.x * dot(uRight, Pt), uProj.y * dot(uUp, Pt), dot(uFwd, Pt));
  vec3 Nq = cross(Qs, Qt); float dist = max(length(Q), 1e-4), along = abs(dot(Nq, Q)) / dist;
  vCos = along / max(length(Nq), 1e-12);   // cosine between the normal and the line of sight (a distorted view angle)
  vSize = along / dist * uSizeNorm;        // area times cosine, over the first power of the distance, per-mood scale
  vST = vec2(s, t) / ${NN - 3}.0;
  vec4 clip = uVP * vec4(P, 1.0);
  gl_Position = clip;
}`;
// Per fragment, from the per-vertex cosine c and size factor S (interpolated): the light is S times the edge fade times
// the sum of two terms (spec 16 and 17). The sheen is the base level times the (fused, so flat) thread profile, flat until
// well past the size factor of the Fresnel-like peak (uCut0), then falling linearly to nearly nothing (uCut1) and fading
// out slowly after that. The Fresnel-like term is a strength times one narrow peak indexed by the product c x S: exactly
// zero over the lower part of the range below the peak (up to uFresZero of the peak's position), a steep rise to the peak,
// and a long thin tail above it (uFresTail). The edge fade is linear and covers the same fraction at the ends and edges.
const FS_WAVE = `#version 300 es
precision highp float;
in float vCos, vSize; in vec2 vST;
uniform float uBright, uBase, uFres, uCut0, uCut1, uFresPeak, uFresZero, uFresTail, uFade;
out vec4 o;
void main(){
  float S = max(vSize, 0.0), x = vCos * S / uFresPeak;
  float prof = S < uCut0 ? 1.0 : (S < uCut1 ? 1.0 - 0.95 * (S - uCut0) / (uCut1 - uCut0) : 0.05 * exp(-(S - uCut1) / uCut1));
  float r = clamp((x - uFresZero) / (1.0 - uFresZero), 0.0, 1.0);
  float fres = uFres * (x < 1.0 ? r * r * (3.0 - 2.0 * r) : exp(-(x - 1.0) / uFresTail));
  vec2 e = min(vST, 1.0 - vST) / uFade;
  float fade = clamp(e.x, 0.0, 1.0) * clamp(e.y, 0.0, 1.0);
  o = vec4(uBright * S * (uBase * prof + fres) * fade, 0.0, 0.0, 1.0);
}`;

// B-spline filtered upscale of the small background image (four bilinear taps).
const GLSL_BG = `
uniform sampler2D uBg; uniform vec2 uBgSize;
vec3 bicubicBg(vec2 uv){
  vec2 st = uv * uBgSize - 0.5, i = floor(st), f = st - i;
  vec2 f2 = f * f, f3 = f2 * f, u = 1.0 - f;
  vec2 w0 = u * u * u / 6.0, w1 = (3.0 * f3 - 6.0 * f2 + 4.0) / 6.0, w2 = (-3.0 * f3 + 3.0 * f2 + 3.0 * f + 1.0) / 6.0, w3 = f3 / 6.0;
  vec2 g0 = w0 + w1, g1 = w2 + w3, h0 = (w1 / g0) - 1.0 + i, h1 = (w3 / g1) + 1.0 + i;
  vec2 p0 = (h0 + 0.5) / uBgSize, p1 = (h1 + 0.5) / uBgSize;
  return g0.y * (g0.x * texture(uBg, vec2(p0.x, p0.y)).rgb + g1.x * texture(uBg, vec2(p1.x, p0.y)).rgb)
       + g1.y * (g0.x * texture(uBg, vec2(p0.x, p1.y)).rgb + g1.x * texture(uBg, vec2(p1.x, p1.y)).rgb);
}`;
// Down-filter over the supersampled wave buffer: a box exactly one destination pixel wide (n x n bilinear taps over
// uWTexel, the destination pixel size in uv, times uWSpread = 1), weighting every supersample of the block alike.
// Spec 27: neither this weighting nor the buffer's precision or range decides whether the band reads as one fused tube or
// as distinct ribbons - a plain average and a weighting that leans on one sample differ in grain, not in the width or the
// separation of anything - so these are left as they are and the band's structure is looked for in the sheet (4.1, 4.4).
const GLSL_WAVEBOX = `
uniform sampler2D uWave; uniform vec2 uWTexel; uniform int uWTaps; uniform float uWSpread;
float waveBox(vec2 uv){
  float s = 0.0, n = float(uWTaps);
  for (int j = 0; j < 4; j++) { if (j >= uWTaps) break;
    for (int i = 0; i < 4; i++) { if (i >= uWTaps) break;
      vec2 off = ((vec2(float(i), float(j)) + 0.5) / n - 0.5) * uWSpread;
      s += texture(uWave, uv + off * uWTexel).r; } }
  return s / (n * n);
}`;

// The composite's exposure and tone curve (spec 17), per mood: a small black offset is subtracted, a gain applied, then the
// extended Reinhard curve with a white point (1 leaves the curve neutral; below 1 it lifts the brightest values slightly).
const GLSL_TONE = `
uniform float uBlack, uGain, uWhite;
vec3 toneMap(vec3 c){ c = max(c - vec3(uBlack), vec3(0.0)) * uGain; return c * (1.0 + c / (uWhite * uWhite)) / (1.0 + c); }`;
// Glare chain. Bright-pass at reduced size from the composite (background and wave) after its tone curve.
const FS_BRIGHT = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
${GLSL_BG}
${GLSL_WAVEBOX}
${GLSL_TONE}
uniform int uBgOn, uWaveOn; uniform vec3 uTintL, uTintR; uniform float uThr;
void main(){
  vec3 c = vec3(0.0);
  if (uBgOn == 1) c += bicubicBg(vUv);
  if (uWaveOn == 1) c += waveBox(vUv) * mix(uTintL, uTintR, vUv.x);
  c = toneMap(c);
  // keep the colour: one weight from the brightest channel, a soft knee (zero up to the threshold, rising above it). The
  // threshold is the mood's own, fixed (spec 20); the knee's width is fixed too, so any threshold works, also above 1.
  float m = max(c.r, max(c.g, c.b)), e = max(m - uThr, 0.0);
  o = vec4(c * (e * e / (e + 0.03)) / max(m, 1e-4), 1.0);

const FS_DOWN = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o; uniform sampler2D uT; uniform vec2 uTexel;
void main(){ o = vec4(0.25 * (texture(uT, vUv + uTexel * vec2(-1, -1)).rgb + texture(uT, vUv + uTexel * vec2(1, -1)).rgb
                     + texture(uT, vUv + uTexel * vec2(-1, 1)).rgb + texture(uT, vUv + uTexel * vec2(1, 1)).rgb), 1.0); }`;
const FS_BLUR = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o; uniform sampler2D uT; uniform vec2 uDir; uniform vec3 uSigma;
void main(){
  vec3 s = texture(uT, vUv).rgb, ws = vec3(1.0);

const FS_COMBINE = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o; uniform sampler2D uT, uCoarse; uniform float uRatio;
void main(){ o = vec4(texture(uT, vUv).rgb + uRatio * texture(uCoarse, vUv).rgb, 1.0); }`;

// Final: background, filtered wave light, glare and dither, written at the output size.
const FS_FINAL = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
${GLSL_BG}
${GLSL_WAVEBOX}
${GLSL_TONE}
uniform sampler2D uGlare; uniform int uBgOn, uWaveOn, uGlareOn, uDither;
uniform vec3 uTintL, uTintR; uniform float uGlareK, uDitherAmp, uFrame;
float h12(vec2 p){ vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
void main(){

  if (uBgOn == 1) c += bicubicBg(vUv);  // no tint here: the whole top-to-bottom profile is in the background's own colours (spec 24)
  if (uWaveOn == 1) c += waveBox(vUv) * mix(uTintL, uTintR, vUv.x);  // a neutral tint brightening slightly to the right

// st: { scene, cam, net0, net1, alpha, sparks, nSparks, layers, frameNo, ease }
// The settings menu may add: view {x, y} (where the picture sits in the output
// target), stopAfter (the last pass to run: 1 background, 2 wave, 3 glare,
// 4 composite, 5 sparkles, 6 glints), timer ({begin(name), end()}, the GPU
// timing of the Performance section) and wire (the line overlays). Score mode

    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, src.tex); gl.uniform1i(pr.u.uPrev, 1);
    gl.uniform1f(pr.u.uTiles, 24); gl.uniform1f(pr.u.uA, sc.monA); gl.uniform1f(pr.u.uB, sc.monB);
    gl.uniform1f(pr.u.uMc, sc.monC); gl.uniform1f(pr.u.uMw, sc.monW); gl.uniform1f(pr.u.uNight, sc.night);
    setBgLights(pr);

    // up the frame, and the ceiling the saturation's raise approaches near the top

    gl.uniform1f(pr.u.uSatCeil, BGL.satCeil);

    gl.uniform1f(pr.u.uNightMix, BGL.nightMix); gl.uniform1f(pr.u.uBase, BGL.base); gl.uniform1f(pr.u.uPale, BGL.pale);
    gl.uniform1f(pr.u.uNightBase, BGL.nightBase); gl.uniform1f(pr.u.uNightEnv, sc.nightEnv); gl.uniform1f(pr.u.uNightFloor, BGL.nightFloor);

    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, netTex[1]); gl.uniform1i(pr.u.uNet1, 1);
    gl.uniform1f(pr.u.uAlpha, st.alpha); gl.uniformMatrix4fv(pr.u.uVP, false, cam.vp);
    const SA = 16 * WAVE.samplesAlong, SV = 16 * WAVE.samplesAcross;

    gl.uniform3fv(pr.u.uCam, cam.pos); gl.uniform3fv(pr.u.uRight, cam.right); gl.uniform3fv(pr.u.uUp, cam.up); gl.uniform3fv(pr.u.uFwd, cam.fwd);
    gl.uniform2f(pr.u.uProj, cam.f * wh / ww, cam.f);

    const SC = SIMM.tunables.SCENE, aRest = SC.len * SC.wid / ((NN - 1) * (NN - 1)) * cam.f * cam.f * wh / ww;
    gl.uniform1f(pr.u.uSizeNorm, m.sizeK * CAMERA.dist / aRest);
    gl.uniform1f(pr.u.uBright, m.waveBright); gl.uniform1f(pr.u.uBase, m.base); gl.uniform1f(pr.u.uFres, m.fres);
    gl.uniform1f(pr.u.uCut0, WAVE.sheenCut0); gl.uniform1f(pr.u.uCut1, WAVE.sheenCut1);
    gl.uniform1f(pr.u.uFresPeak, WAVE.fresPeak); gl.uniform1f(pr.u.uFresZero, WAVE.fresZero); gl.uniform1f(pr.u.uFresTail, WAVE.fresTail);

    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, glareT ? glareT.tex : bgT.tex); gl.uniform1i(pr.u.uGlare, 2);
    gl.uniform1i(pr.u.uGlareOn, glareT ? 1 : 0); gl.uniform1f(pr.u.uGlareK, glareK);

    if (T) T.begin('sparkles');

    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, st.nSparks);

      if (T) T.begin('glints');

function buildGlare(m, bgT, bgOn, waveOn) {

    bindTarget(l.c); gl.bindTexture(gl.TEXTURE_2D, l.b.tex); gl.uniform2f(pr.u.uDir, 0, 1 / l.h); quad();
  }

  // most - the ordering spec 27 confirms: the coarse levels give the halo its shape and nothing a measure of the finished
  // frame can see, so a glare that lifts a broad area is a broad bright-pass and not a mis-weighted pyramid)
  pr = PR.combine; gl.useProgram(pr.p); gl.uniform1i(pr.u.uT, 0); gl.uniform1i(pr.u.uCoarse, 1);

// Wireframe overlays of the real geometry, drawn over the finished picture

      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, netTex[1]); gl.uniform1i(pr.u.uNet1, 1);

// Deterministic score mode
// ---------------------------------------------------------------------------
function parseLayers(s) {

  if (s == null || s === '') return all;
  const L = { bg: false, wave: false, glare: false, sparkles: false, dither: false };
  for (const k of String(s).split(',')) { const t = k.trim(); if (t in L) L[t] = true; }
  return L;
}
const urlOpts = { time: params.get('time'), theme: params.get('theme'), seed: params.get('seed'), frames: params.get('frames'),
  w: params.get('w'), h: params.get('h'), layers: params.get('layers') };
function resolveOpts(opts) {
  const g = k => (opts && opts[k] != null ? opts[k] : urlOpts[k]);
  return {
    timeParts: parseTime(g('time')) || partsOf(new Date()),
    theme: Math.max(0, Math.min(12, parseInt(g('theme') ?? 0, 10) || 0)),
    seed: parseInt(g('seed') ?? 1, 10) || 0,
    frames: Math.max(0, parseInt(g('frames') ?? 0, 10) || 0),
    w: Math.max(1, parseInt(g('w') ?? 1920, 10) || 1920),
    h: Math.max(1, parseInt(g('h') ?? 1080, 10) || 1080),

}

function render(opts) {
  const o = resolveOpts(opts);
  const scene = sceneParams(o.timeParts, o.theme);
  const cam = cameraFor(scene.mood.camPitch, o.w / o.h, scene.mood.camLift);
  // without the wave and the sparkles the frame does not depend on the simulation, which is then not run
  const needSim = o.layers.wave || o.layers.sparkles;
  const key = [o.seed, o.theme, o.timeParts.join(','), o.w / o.h].join('|');
  if (needSim && (!scoreSim || scoreSim.key !== key || scoreSim.frames > o.frames)) {
    const sim = SIMM.createSim(o.seed);
    sim.setMood(simMoodParams(scene.mood, cam));
    sim.warm(sim.warmSteps);
    scoreSim = { key, sim, frames: 0 };
  }
  if (needSim) while (scoreSim.frames < o.frames) { scoreSim.sim.step(); scoreSim.frames++; }
  const sim = needSim ? scoreSim.sim : null;
  const n = sim ? sim.packSparks(sparkPack) : 0;
  ensureTargets(o.w, o.h, o.w, o.h, 2);
  RT.bgFresh = true;
  renderFrame({ scene, cam, net0: sim && sim.netCur, net1: sim && sim.netCur, alpha: 1, sparks: sparkPack, nSparks: n,
    layers: o.layers, frameNo: o.frames, ease: 1 }, RT.out);

  for (let y = 0; y < o.h; y++) data.set(px.subarray((o.h - 1 - y) * row, (o.h - y) * row), y * row);

  if (lay.view) { bindTarget(null); gl.viewport(0, 0, lay.canvasW, lay.canvasH); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); } // the canvas around the picture
  const ease = S.layers.bgEase ? BG_EASE : 1;
  const I = S.inspect, stopAfter = I.stopAfter || undefined, inspecting = I.buffer !== 'output' || (I.stopAfter > 0 && I.stopAfter < 4);
  if (!latest) { // the worker is still warming up: show the background alone
    renderFrame({ scene, cam, net0: null, net1: null, alpha: 1, sparks: null, nSparks: 0,
      layers: { ...S.layers, wave: false, glare: false, sparkles: false }, frameNo: frameNo++, ease, view: lay.view }, null);
    fpsTick(now, lay);
    return;
  }
  const alpha = paused ? 1 : Math.min(1, latest.alpha + (performance.timeOrigin + now - latest.at) / 1000 / DT * S.waveSpeed);
  if (!firstState) firstState = now;
  const fadeIn = Math.min(1, (now - firstState) / 1200); // the wave and sparkles fade in over the first second
  if (fadeIn < 1) { scene.mood = { ...scene.mood, waveBright: scene.mood.waveBright * fadeIn, sparkBright: scene.mood.sparkBright * fadeIn, glareStrength: scene.mood.glareStrength * fadeIn }; }
  const W = S.wire, wire = W.mesh || W.grid || W.quads ? { ...W, meshSA: 16 * WAVE.samplesAlong / W.meshStride, meshSV: 16 * WAVE.samplesAcross / W.meshStride } : null;
  const timer = gpuProbe && gpuProbe.left > 0 ? (gpuProbe.left--, probeTimer()) : null;
  renderFrame({ scene, cam, net0: latest.net0, net1: latest.net1, alpha, sparks: latest.sparks, nSparks: latest.n,
    layers: S.layers, frameNo: frameNo++, ease, view: lay.view, stopAfter, timer, wire }, null);
  if (inspecting) showInspect(lay, now);
  if (gpuProbe) pollGpuProbe();
  fpsTick(now, lay);
}
schedule();
})();
</script>
