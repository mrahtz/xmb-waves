<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Waves">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>xmb-waves</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; -webkit-user-select: none; user-select: none; }
  /* the picture: placed and sized by the Picture settings (see layout() in the script) */
  #c { display: block; position: fixed; left: 0; top: 0; }
  /* the round settings button: a menu icon while the panel is closed, a close icon while it is open */
  #gear { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); z-index: 3;
    width: 40px; height: 40px; border-radius: 20px; border: 0; padding: 0; background: rgba(10, 12, 18, .55); color: #fff;
    opacity: 0; transition: opacity .4s; cursor: pointer; display: grid; place-items: center;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  body.active #gear, #gear.open, #gear:focus-visible { opacity: .9; }
  #gear svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  #gear .ic-close, #gear.open .ic-menu { display: none; }
  #gear.open .ic-close { display: block; }
  /* the side panel: floats over the picture, scrolls, collapsible sections */
  #panel { position: fixed; top: 0; right: 0; bottom: 0; z-index: 2; width: min(330px, calc(100vw - 24px)); box-sizing: border-box;
    padding: max(8px, env(safe-area-inset-top)) 12px calc(max(12px, env(safe-area-inset-bottom)) + 56px) 12px;
    overflow-y: auto; overscroll-behavior: contain; display: none;
    font: 13px/1.45 system-ui, sans-serif; color: #eee; background: rgba(10, 12, 18, .66);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  #panel.open { display: block; }
  #panel details { border-top: 1px solid rgba(255, 255, 255, .12); }
  #panel summary { cursor: pointer; padding: 8px 0; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 8px; }
  #panel summary::-webkit-details-marker { display: none; }
  #panel summary::before { content: ''; width: 6px; height: 6px; margin-left: 2px; border-right: 2px solid #ccc; border-bottom: 2px solid #ccc;
    transform: rotate(-45deg); transition: transform .15s; }
  #panel details[open] > summary::before { transform: rotate(45deg); }
  #panel .body { padding: 0 0 10px; }
  #panel .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; flex-wrap: wrap; }
  #panel .row .lbl { flex: 0 0 100px; color: #bbb; }
  #panel .row .ctl { flex: 1 1 auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
  #panel .note, #panel .hint { color: #9a9a9a; font-size: 12px; margin: -2px 0 6px; }
  #panel .note { margin-left: 108px; }
  #panel h4 { margin: 12px 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #9ab; }
  #panel .seg { display: inline-flex; flex-wrap: wrap; gap: 2px; }
  #panel .seg button { background: rgba(255, 255, 255, .08); color: #ddd; border: 0; border-radius: 6px; padding: 3px 8px; font: inherit; cursor: pointer; }
  #panel .seg button.on { background: #e8e8f0; color: #111; }
  #panel .btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  #panel .btns button, #panel button.act { background: rgba(255, 255, 255, .12); color: #eee; border: 0; border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
  #panel .btns button:hover, #panel button.act:hover, #panel .seg button:hover { background: rgba(255, 255, 255, .22); }
  #panel .seg button.on:hover { background: #fff; }
  #panel .btns button:disabled { opacity: .4; cursor: default; }
  #panel label.chk { display: flex; align-items: center; gap: 8px; margin: 4px 0; cursor: pointer; }
  #panel input[type=range] { flex: 1 1 70px; min-width: 50px; margin: 0; }
  #panel input[type=number], #panel input[type=datetime-local], #panel select { font: inherit; font-size: 12px; background: rgba(0, 0, 0, .35);
    color: #eee; border: 1px solid rgba(255, 255, 255, .2); border-radius: 4px; padding: 2px 4px; max-width: 100%; }
  #panel input[type=number] { width: 66px; }
  #panel .param .lbl { font-size: 12px; }
  #panel .param.follow input[type=range] { opacity: .5; }
  #panel .param .reset { background: none; border: 0; color: #bbb; cursor: pointer; padding: 0 3px; font: inherit; font-size: 15px; line-height: 1; }
  #panel .param .reset:disabled { opacity: .25; cursor: default; }
  #panel .val { min-width: 40px; color: #ddd; }
  #panel pre.out { font: 11px/1.4 ui-monospace, monospace; white-space: pre-wrap; margin: 4px 0; color: #cfd; }
  /* the frame-rate counter overlay */
  #fps { position: fixed; left: max(8px, env(safe-area-inset-left)); top: max(8px, env(safe-area-inset-top)); z-index: 2; display: none;
    font: 12px/1.3 ui-monospace, monospace; color: #fff; background: rgba(0, 0, 0, .45); padding: 5px 7px; border-radius: 5px; }
  #fps.on { display: block; }
  #fps canvas { display: block; margin-top: 4px; width: 120px; height: 28px; }
  #fps pre { margin: 4px 0 0; font: inherit; white-space: pre; }
  #fps div[hidden], #fps canvas[hidden], #fps pre[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fps"><div id="fpsText"></div><canvas id="fpsGraph" width="120" height="28"></canvas><pre id="stats"></pre></div>
<aside id="panel" aria-label="settings"></aside>
<button id="gear" aria-label="settings" aria-expanded="false">
  <svg class="ic-menu" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  <svg class="ic-close" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
</button>
<script>
// Simulation module: the wave's spring net, its free-form deformation, and the
// sparkle pool. Pure JavaScript with no DOM access, so the same source runs in a
// Web Worker (normal mode) and on the main thread (deterministic score mode).
function XMBW_SIM() {
  'use strict';
  const N = 19;            // control grid, N x N points
  const DT = 1 / 60;       // fixed step
  const H = 1 / (N - 1);   // grid spacing in net units (the net is a unit square)

  // ---- tunables (all original design values) ----
  const NET = {
    kStruct: 0.25, kBend: 1.25,    // spring constants along the length (unit masses); soft, so the folds travel slowly
    alongRest: 1.0,                 // rest length of the along-springs relative to the grid spacing: 1.0 keeps the
                                    // sheet smooth; above 1 the slack buckles into standing wrinkles (wirier than the reference)
    hold: 0.0002,                   // weak pull of every node towards its rest position: stops the slack sheet creeping
                                    // over minutes without touching the folds or the wrinkles
    acrossK: 0.25,                  // the across-the-width springs are this much softer, so pleats persist along the length
    damping: 0.001,                 // fraction of velocity removed per step (low, so the folds persist along the length)
    noise: 0.0001,                  // velocity kick per step (std dev); kept tiny, or the control net jitters and the fold lines stipple
    push: 0.005,                    // steady gentle pull on the free end, along the length, so the sheet stays extended
    driveA: 0.050, driveW1: 0.42,   // driven end: height amplitude, angular frequency
    driveB: 0.070, driveW2: 0.25,   // driven end: depth amplitude, angular frequency
    driveMix: 0.7,                  // the second family also moves the driven end in height, at this fraction of driveA, so its fold lines show and cross the first family's
    drivePhase1: 0.87, drivePhase2: -0.58, // phase change per row: the driven edge is folded across its width (about 2.5 folds); the two
                                          // families run opposite ways across, so their fold lines cross
    driveEase: 0.02,                // easing of the driving clock towards sim time
    envLow: 0.85, envWidth: 0.30,   // envelope along the length: subdued level, transition half-width
    warm: 1500,                     // warm-up steps before frame 0
  };
  // Free-form deformation lattice: more cells along the length than across or in depth.
  const LAT = { nu: 10, nv: 4, nw: 4, ease: 0.02,
    // sways: [amplitude, spatial freq (rad per unit u), temporal freq (rad/s), depth variation]; the temporal
    // frequencies are all negative so every sway travels towards the near end. The first two are slow and
    // twist the sheet across its width (so the band tilts, arches and pinches); the third is the swell: a
    // gentle rise and fall about two screen widths long, with a period of about 20 s at a fixed column,
    // that travels along the band and lifts the whole band, strands together
    sways: [[0.034, 1.55, -0.082, 1.4], [0.030, 2.65, -0.130, 1.6], [0.040, 6.0, -0.30, 0.8]],
    bump: { amp: 0.020, width: 0.18, speed: 0.021 },
  };
  // Scene mapping of the deformed net (scene units; x along the length, y up, z away).
  const SCENE = { len: 10, wid: 4.0, height: 7.0, y0: 0.05, z0: 0.0, tilt: 0.0 }; // tilt: rise per unit length towards the near end

  const SPARK = {
    pool: 2000,
    burstP: 0.30, burstMin: 1, burstMax: 9,        // per step
    walkers: 6, walkerP: 0.05, walkMin: 40, walkMax: 220, walkStep: 0.045, // patches per step
    cone: 0.35, reverseP: 0.12,
    speedK: 0.32, speedPow: 0.5, speedMin: 0.035, // scene units / s
    rateMean: 1 / 6.5, rateSpread: 0.30, rateMin: 1 / 14, // life per second
    rampIn: 0.06, rampOut: 0.16,
    jitter: 0.045, gravity: 0.004, friction: 0.22,  // per second units
    spinA: 2.2, spinF: [0.21, 0.37],                // rad/s amplitude, oscillation freq range (rad/s)
    box: [[-7, 7], [-3.0, 3.2], [-3.5, 5.0]],
  };
  const SPARK_STRIDE = 11; // prev xyz, cur xyz, facing xyz, opacity, random

  function mulberry(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0; let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash32(a) {
    a |= 0; a = (a ^ 61) ^ (a >>> 16); a = Math.imul(a, 9); a ^= a >>> 4;
    a = Math.imul(a, 0x27d4eb2d); a ^= a >>> 15; return a >>> 0;
  }

  // Uniform cubic B-spline basis and derivative.
  function bsp(t, out) {
    const t2 = t * t, t3 = t2 * t, u = 1 - t;
    out[0] = u * u * u / 6; out[1] = (3 * t3 - 6 * t2 + 4) / 6;
    out[2] = (-3 * t3 + 3 * t2 + 3 * t + 1) / 6; out[3] = t3 / 6;
    return out;
  }

  // Live tuning from the settings menu: values maps dotted paths into the tunables
  // above ('NET.kStruct', 'LAT.sways.0.0', ...) to numbers. Only a number that
  // already exists is set, so a stale or mistyped key does nothing. Sizes fixed at
  // creation (the pool, the lattice cells, the walker count) are not tunable.
  const TUNABLES = { NET, LAT, SCENE, SPARK };
  function setTunables(values) {
    for (const path in values) {
      const p = path.split('.'); let o = TUNABLES[p[0]];
      for (let i = 1; o != null && i < p.length - 1; i++) o = o[p[i]];
      const k = p[p.length - 1], v = values[path];
      if (o != null && typeof o[k] === 'number' && typeof v === 'number' && isFinite(v)) o[k] = v;
    }
  }

  function createSim(seed) {
    const rng = mulberry(hash32(seed ^ 0x5eed1234) ^ 0x9e3779b9);
    const gauss = () => { let u = rng(); if (u < 1e-12) u = 1e-12; return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185307179586 * rng()); };
    const NP = N * N;
    const pos = new Float64Array(NP * 3), vel = new Float64Array(NP * 3), acc = new Float64Array(NP * 3);
    const rest = new Float64Array(NP * 3);
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const k = (j * N + i) * 3; rest[k] = i * H; rest[k + 1] = 0; rest[k + 2] = j * H;
      pos[k] = rest[k]; pos[k + 2] = rest[k + 2];
    }
    // springs: [a, b, rest, k]
    const springs = [];
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const a = j * N + i;
      if (i + 1 < N) springs.push([a, a + 1, H * NET.alongRest, NET.kStruct]);
      if (j + 1 < N) springs.push([a, a + N, H, NET.kStruct * NET.acrossK]);
      if (i + 2 < N) springs.push([a, a + 2, 2 * H * NET.alongRest, NET.kBend]);
      if (j + 2 < N) springs.push([a, a + 2 * N, 2 * H, NET.kBend * NET.acrossK]);
    }
    const SA = Int32Array.from(springs.map(s => s[0])), SB = Int32Array.from(springs.map(s => s[1]));
    const SR = Float64Array.from(springs.map(s => s[2])), SK = Float64Array.from(springs.map(s => s[3]));
    // Re-derive the rest lengths and spring constants from NET after a live change
    // of the tunables (the same order and expressions as above).
    function rebuildSprings() {
      let s = 0;
      for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
        if (i + 1 < N) { SR[s] = H * NET.alongRest; SK[s] = NET.kStruct; s++; }
        if (j + 1 < N) { SR[s] = H; SK[s] = NET.kStruct * NET.acrossK; s++; }
        if (i + 2 < N) { SR[s] = 2 * H * NET.alongRest; SK[s] = NET.kBend; s++; }
        if (j + 2 < N) { SR[s] = 2 * H; SK[s] = NET.kBend * NET.acrossK; s++; }
      }
    }

    // lattice displacement values (vertical), eased towards targets
    const NL = LAT.nu * LAT.nv * LAT.nw;
    const lat = new Float64Array(NL);
    const latPh = LAT.sways.map(() => [rng() * 6.2832, rng() * 6.2832]);
    const bumpPh = rng();

    let simTime = rng() * 1000, driveT = simTime, steps = 0;
    const mood = { envCross: 0.55, latScale: [1, 1, 1], camFwd: [-0.34, -0.12, 0.93] };

    // deformed scene-space nets (previous and current step)
    let netPrev = new Float32Array(NP * 3), netCur = new Float32Array(NP * 3);

    // sparkle pool
    const S = SPARK.pool;
    const sp = new Float64Array(S * 3), sv = new Float64Array(S * 3), spPrev = new Float64Array(S * 3);
    const sq = new Float64Array(S * 4), sAge = new Float64Array(S), sRate = new Float64Array(S);
    const sSpin = new Float64Array(S * 6), sRnd = new Float64Array(S);
    const alive = new Uint8Array(S);
    const free = new Int32Array(S); let nFree = S;
    for (let i = 0; i < S; i++) free[i] = S - 1 - i;
    const walkers = [];
    for (let w = 0; w < SPARK.walkers; w++) walkers.push({ on: false, s: 0, t: 0, dir: 1, left: 0 });

    function latticeTargets() {
      const T = simTime;
      for (let iw = 0; iw < LAT.nw; iw++) for (let iv = 0; iv < LAT.nv; iv++) for (let iu = 0; iu < LAT.nu; iu++) {
        const u = (iu - 1) / (LAT.nu - 3), w = (iw - 1) / (LAT.nw - 3), v = (iv - 1) / (LAT.nv - 3);
        let d = 0;
        for (let m = 0; m < LAT.sways.length; m++) {
          const s = LAT.sways[m];
          d += s[0] * (1 + s[3] * (w - 0.5) + 0.1 * (v - 0.5)) * Math.sin(s[1] * u + s[2] * T + latPh[m][0] + 0.8 * s[3] * w);
        }
        const ub = (((T * LAT.bump.speed + bumpPh) % 1) + 1) % 1 * 1.8 - 0.4;
        const du = (u - ub) / LAT.bump.width;
        d += LAT.bump.amp * Math.exp(-du * du) * (1 + 0.3 * (w - 0.5));
        const k = (iw * LAT.nv + iv) * LAT.nu + iu;
        lat[k] += (d - lat[k]) * LAT.ease;
      }
    }
    function latticeInit() { const e = LAT.ease; LAT.ease = 1; latticeTargets(); LAT.ease = e; }

    const bu = [0, 0, 0, 0], bv = [0, 0, 0, 0], bw = [0, 0, 0, 0];
    function ffd(u, v, w) { // tricubic B-spline blend of lattice values at normalised coords
      const fu = Math.min(Math.max(u, 0), 1) * (LAT.nu - 3), fv = Math.min(Math.max(v, 0), 1) * (LAT.nv - 3), fw = Math.min(Math.max(w, 0), 1) * (LAT.nw - 3);
      const iu = Math.min(Math.floor(fu), LAT.nu - 4), iv = Math.min(Math.floor(fv), LAT.nv - 4), iw = Math.min(Math.floor(fw), LAT.nw - 4);
      bsp(fu - iu, bu); bsp(fv - iv, bv); bsp(fw - iw, bw);
      let d = 0;
      for (let c = 0; c < 4; c++) for (let b = 0; b < 4; b++) {
        const wbc = bv[b] * bw[c]; const base = ((iw + c) * LAT.nv + (iv + b)) * LAT.nu + iu;
        d += wbc * (bu[0] * lat[base] + bu[1] * lat[base + 1] + bu[2] * lat[base + 2] + bu[3] * lat[base + 3]);
      }
      return d;
    }
    function smooth(e0, e1, x) { const t = Math.min(Math.max((x - e0) / (e1 - e0), 0), 1); return t * t * (3 - 2 * t); }

    // net -> envelope -> FFD -> scene
    function deform(out) {
      const ls = mood.latScale;
      for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
        const k = (j * N + i) * 3;
        const fx = i / (N - 1);
        const env = NET.envLow + (1 - NET.envLow) * smooth(mood.envCross - NET.envWidth, mood.envCross + NET.envWidth, fx);
        const x = pos[k];
        const y = (pos[k + 1] - rest[k + 1]) * env;
        const z = rest[k + 2] + (pos[k + 2] - rest[k + 2]) * env;
        // lattice normalised coords: the lattice spans the net's region with a margin
        const u = (x + 0.1) / 1.2, v = (y + 0.5), w = (z + 0.1) / 1.2;
        const dy = ffd(u, v, w);
        out[k] = (x - 0.5) * SCENE.len * ls[0];
        out[k + 1] = (y + dy) * SCENE.height * ls[1] + SCENE.y0 + SCENE.tilt * out[k];
        out[k + 2] = (z - 0.5) * SCENE.wid * ls[2] + SCENE.z0;
      }
    }

    function stepNet() {
      acc.fill(0);
      for (let s = 0; s < SA.length; s++) {
        const a = SA[s] * 3, b = SB[s] * 3;
        const dx = pos[b] - pos[a], dy = pos[b + 1] - pos[a + 1], dz = pos[b + 2] - pos[a + 2];
        const L = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1e-9;
        const f = SK[s] * (L - SR[s]) / L;
        acc[a] += f * dx; acc[a + 1] += f * dy; acc[a + 2] += f * dz;
        acc[b] -= f * dx; acc[b + 1] -= f * dy; acc[b + 2] -= f * dz;
      }
      for (let j = 0; j < N; j++) acc[(j * N + N - 1) * 3] += NET.push; // free end i = N-1, pulled outwards
      for (let k = 0; k < NP * 3; k++) acc[k] -= NET.hold * (pos[k] - rest[k]); // the weak hold towards the rest shape
      for (let p = 0; p < N * N; p++) {
        const k = p * 3;
        vel[k] += acc[k] * DT + NET.noise * gauss();
        vel[k + 1] += acc[k + 1] * DT + NET.noise * gauss();
        vel[k + 2] += acc[k + 2] * DT + NET.noise * gauss();
        pos[k] += vel[k] * DT; pos[k + 1] += vel[k + 1] * DT; pos[k + 2] += vel[k + 2] * DT;
        vel[k] *= 1 - NET.damping; vel[k + 1] *= 1 - NET.damping; vel[k + 2] *= 1 - NET.damping;
      }
      // driven end i = 0 (the far end), placed kinematically
      driveT += (simTime - driveT) * NET.driveEase;
      for (let j = 0; j < N; j++) {
        const k = (j * N) * 3;
        pos[k] = rest[k];
        pos[k + 1] = NET.driveA * (Math.sin(NET.driveW1 * driveT + j * NET.drivePhase1) + NET.driveMix * Math.sin(NET.driveW2 * driveT + j * NET.drivePhase2));
        pos[k + 2] = rest[k + 2] + NET.driveB * Math.sin(NET.driveW2 * driveT + j * NET.drivePhase2 + 1.3);
        vel[k] = vel[k + 1] = vel[k + 2] = 0;
      }
    }

    // B-spline surface evaluation on a deformed net: s in [0, N-3] along, t in [0, N-3] across.
    const es = [0, 0, 0, 0], et = [0, 0, 0, 0];
    function surf(net, s, t, out) {
      const is = Math.min(Math.max(Math.floor(s), 0), N - 4), it = Math.min(Math.max(Math.floor(t), 0), N - 4);
      bsp(s - is, es); bsp(t - it, et);
      let x = 0, y = 0, z = 0;
      for (let b = 0; b < 4; b++) for (let a = 0; a < 4; a++) {
        const w = es[a] * et[b], k = ((it + b) * N + is + a) * 3;
        x += w * net[k]; y += w * net[k + 1]; z += w * net[k + 2];
      }
      out[0] = x; out[1] = y; out[2] = z; return out;
    }

    const P0 = [0, 0, 0], P1 = [0, 0, 0];
    function birth(s, t) {
      if (nFree === 0) return;
      surf(netPrev, s, t, P0); surf(netCur, s, t, P1);
      let dx = P1[0] - P0[0], dy = P1[1] - P0[1], dz = P1[2] - P0[2];
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (d < 1e-7) return;
      dx /= d; dy /= d; dz /= d;
      // spread within a cone: add a random perpendicular-ish offset
      const c = SPARK.cone;
      dx += c * gauss() * 0.5; dy += c * gauss() * 0.5; dz += c * gauss() * 0.5;
      if (rng() < SPARK.reverseP) { dx = -dx; dy = -dy; dz = -dz; }
      const f = mood.camFwd, along = dx * f[0] + dy * f[1] + dz * f[2];
      dx -= along * f[0]; dy -= along * f[1]; dz -= along * f[2];
      const n = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (n < 1e-6) return;
      const speed = Math.max(SPARK.speedMin, SPARK.speedK * Math.pow(d / DT, SPARK.speedPow)) * (0.6 + 0.8 * rng());
      const i = free[--nFree];
      alive[i] = 1;
      const k = i * 3;

// Per fragment: c = cosine between the normal and the line of sight. A translucent
// sheet is brighter the more obliquely it is seen: the sheen response is
// exp(-(c / baseC)^baseK), with baseK 2 a flat-topped curve that stays near full
// brightness over the nearly edge-on faces (so a sheet seen at a shallow angle
// is a broad, evenly lit ribbon) and falls to a faint level where the sheet
// faces the viewer; where a layer turns exactly edge-on a weak soft line is
// added, so the folds stand out only moderately above the lit faces, as in the
// reference. Both are bounded; the cell's true size scales the light where it
// was widened (see the vertex shader), so overlapping layers add up to the right total.
const FS_WAVE = `#version 300 es
precision highp float;
in vec3 vP; in vec3 vN; in vec2 vST; in float vWidth;
uniform vec3 uCam; uniform float uBright, uBase, uBaseC, uBaseK, uEdge, uEdgeC, uThreads, uThreadAmp, uFadeEnds, uFadeEdges;

  float t = vST.y;

// Smoothing filter over the supersampled wave buffer: n x n bilinear taps spread

in vec2 vUv; out vec4 o;

void main(){ o = uColor; }`;

  const timer = gpuProbe && gpuProbe.left > 0 ? (gpuProbe.left--, probeTimer()) : null;
  renderFrame({ scene, cam, net0: latest.net0, net1: latest.net1, alpha, sparks: latest.sparks, nSparks: latest.n,
    layers: S.layers, frameNo: frameNo++, ease, view: lay.view, stopAfter, timer, wire }, null);
  if (inspecting) showInspect(lay, now);
  if (gpuProbe) pollGpuProbe();
  fpsTick(now, lay);
}
schedule();
})();
</script>
