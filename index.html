<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; -webkit-user-select: none; user-select: none; }
  /* the picture: placed and sized by the Picture settings (see layout() in the script) */
  #c { display: block; position: fixed; left: 0; top: 0; }
  /* the round settings button: a menu icon while the panel is closed, a close icon while it is open */
  #gear { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); z-index: 3;
    width: 40px; height: 40px; border-radius: 20px; border: 0; padding: 0; background: rgba(10, 12, 18, .55); color: #fff;
    opacity: 0; transition: opacity .4s; cursor: pointer; display: grid; place-items: center;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  body.active #gear, #gear.open, #gear:focus-visible { opacity: .9; }
  #gear svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  #gear .ic-close, #gear.open .ic-menu { display: none; }

  /* the side panel: floats over the picture, scrolls, collapsible sections */

  #panel details { border-top: 1px solid rgba(255, 255, 255, .12); }

  #panel summary::-webkit-details-marker { display: none; }

    transform: rotate(-45deg); transition: transform .15s; }
  #panel details[open] > summary::before { transform: rotate(45deg); }

  #panel .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; flex-wrap: wrap; }

  #panel h4 { margin: 12px 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #9ab; }

  #panel .seg button.on { background: #e8e8f0; color: #111; }
  #panel .btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  #panel .btns button, #panel button.act { background: rgba(255, 255, 255, .12); color: #eee; border: 0; border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
  #panel .btns button:hover, #panel button.act:hover, #panel .seg button:hover { background: rgba(255, 255, 255, .22); }
  #panel .seg button.on:hover { background: #fff; }
  #panel .btns button:disabled { opacity: .4; cursor: default; }
  #panel label.chk { display: flex; align-items: center; gap: 8px; margin: 4px 0; cursor: pointer; }

  #panel input[type=number] { width: 66px; }
  #panel .param .lbl { font-size: 12px; }

// Simulation module: the wave's spring net, its free-form deformation, and the
// sparkle pool. Pure JavaScript with no DOM access, so the same source runs in a
// Web Worker (normal mode) and on the main thread (deterministic score mode).
function XMBW_SIM() {
  'use strict';
  const N = 19;            // control grid, N x N points
  const DT = 1 / 60;       // fixed step
  const H = 1 / (N - 1);   // grid spacing in net units (the net is a unit square)

  // ---- tunables (all original design values) ----
  const NET = {
    kStruct: 0.3119, kBend: 2.247,    // spring constants along the length (unit masses); the bending springs are much
                                    // stiffer than the direct ones (eight times; spec 17)
    alongRest: 1.0,                 // rest length of the along-springs relative to the grid spacing: 1.0 keeps the
                                    // sheet smooth; above 1 the slack buckles into standing wrinkles (wirier than the reference)
    acrossK: 0.8382,                 // the across-the-width springs are comparable to the along ones (a little stiffer); with the
                                    // stiffer bending springs this makes the picture hold together longer from second to second
    damping: 0.000139,              // fraction of velocity removed per step: light, a decay time of 120 s, two cycles of the
                                    // slower drive motion (spec 14); folds launched at the shaken end still travel at the free end
    noise: 8e-5,                  // velocity kick per step (std dev). Besides keeping the motion alive, the kicks set how
                                    // many strands the band shows: the across-the-width springs have no linear stiffness at
                                    // rest length, so the kicks drive neighbouring rows apart into separate strands; 3.5e-4 gives
                                    // the reference's 3-4 brightness peaks and about 0.8 dark partings per column, 2e-5 a broad
                                    // ribbon of two or three layers whose lines stand too high above the band; much larger values
                                    // make the net jitter and the fold lines stipple
    push: 0.012,                    // steady gentle pull on the free end, along the length, so the sheet stays extended
    // the drive (spec 14, fixed, not tuned): slow (each swing several times longer than the swell's crossing), each end
    // moving less than a grid spacing (0.056), up-and-down travel twice the towards-and-away, which is the faster motion
    driveA: 0.040, driveW1: 0.1047,   // driven end: height amplitude, angular frequency (a 60 s cycle)
    driveB: 0.020, driveW2: 0.1571,   // driven end: depth amplitude, angular frequency (a 40 s cycle)
    drivePhase1: 0.4472, drivePhase2: 1.141,  // phase change per row for height and depth: the driven points are strung out along the
                                          // shared path (about 1.1 cycles across the edge in height, 2.4 in depth); the depth offset builds up more
                                          // than the height offset, and that difference between the axes is what makes the folds cross
    driveEase: 0.02,                // easing of the driving clock towards sim time
    // envelope along the length (spec 17): fullest near the shaken end, falling to envLow by the mood's crossover, with a
    // dip of envDip (width envWidth) just past it; moderate and nearly even over the rest, which includes all that is visible
    envLow: 0.6, envDip: 0.15, envWidth: 0.08,
    warm: 6000,                     // warm-up steps before frame 0, at least. Without a stored state the lightly damped net
                                    // needs several decay times to settle into its running state from the flat start, so the
                                    // warm-up runs warmDecays of them (the first warmSettle steps with heavy damping)
    warmSettle: 1500, warmDecays: 3,
  };

  const LAT = { nu: 10, nv: 4, nw: 4,
    spread: 5.614,                    // uneven layout along the length: the cells at the free end are this many times longer than
                                    // at the shaken end (fixed), so the free end of the net covers far more of the scene
    // The vertical displacement is the sum of four slow parts, computed directly from the clock (rates in rad/s):
    // a wave rolling from the shaken end to the free end, growing along the length, whose strength swells and fades.
    // It is the swell: its crest crossing the screen is the band's slow left-to-right rise and fall
    rollAmp: 0.06, rollGrow: 2.664, rollWaves: 1.141, rollW: 0.2, rollMod: 0.35, rollModW: 0.041,
    // one soft hump sliding back and forth along the length (centre and travel as fractions of the length; part of
    // its travel lies beyond the shaken end)
    bumpAmp: 0.12, bumpWidth: 0.25, bumpCentre: 0.25, bumpTravel: 0.5, bumpW: 0.037,
    bobAmp: 0.02617, bobW: 0.06,     // the whole sheet rising and falling together, much more slowly than the swell
    twistAmp: 0.04, twistW: 0.19,  // a gentle ripple, one cycle across the width, travelling across it
  };

  const SCENE = { len: 15, x0: 1.9, wid: 4.682, height: 3.8, y0: 0.05, z0: 0.0, tilt: 0.0 }; // tilt: rise per unit length towards the near end

  const SPARK = {
    pool: 2000,
    // births (spec 16): bursts on a large share of the steps, each a fixed batch at random points of the sheet, supply nearly
    // all of them; a single walker leaves a trail along the length, one sparkle every other step, and its births come after
    // the bursts' so they are the ones dropped once the pool is full
    burstP: 0.6, burstN: 12,
    walkers: 1, walkerP: 0.02, walkMin: 40, walkMax: 220, walkStep: 0.045, // patches per step
    cone: 0.6, reverseP: 0.12,                      // cone: half-angle (rad) of the birth cone, deviation spread evenly up to it

    rateMean: 1 / 6.5, rateSpread: 0.30, rateMin: 1 / 14, // life per second

    let s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0; let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);

  }

// ---------------------------------------------------------------------------
// Camera (original design): looks across the sheet from in front, very nearly at right angles to its length (a slight
// yaw puts the shaken left side nearer), from slightly below it, looking up (negative pitch); the pitch follows the mood
// (flatter at night).
// ---------------------------------------------------------------------------
const CAMERA = { fovY: 64.4, yaw: 6, dist: 3.161, target: [0.8, -0.1, 0.0], near: 0.1, far: 40 }; // a moderate field of view, close; the sheet seen from slightly below (spec 17)
function cameraFor(pitchDeg, aspect) {
  const d2r = Math.PI / 180, p = pitchDeg * d2r, yw = CAMERA.yaw * d2r;
  const fwd = [Math.sin(yw) * Math.cos(p), -Math.sin(p), Math.cos(yw) * Math.cos(p)];
  const right = [Math.cos(yw), 0, -Math.sin(yw)];
  const up = [fwd[1] * right[2] - fwd[2] * right[1], fwd[2] * right[0] - fwd[0] * right[2], fwd[0] * right[1] - fwd[1] * right[0]];
  const pos = CAMERA.target.map((t, i) => t - CAMERA.dist * fwd[i]);
  const f = 1 / Math.tan(CAMERA.fovY * d2r / 2), n = CAMERA.near, fa = CAMERA.far;
  // view: rows right, up, -fwd (right-handed clip convention); column-major for GL
  const tx = -(right[0] * pos[0] + right[1] * pos[1] + right[2] * pos[2]);
  const ty = -(up[0] * pos[0] + up[1] * pos[1] + up[2] * pos[2]);
  const tz = (fwd[0] * pos[0] + fwd[1] * pos[1] + fwd[2] * pos[2]);
  const view = [right[0], up[0], -fwd[0], 0, right[1], up[1], -fwd[1], 0, right[2], up[2], -fwd[2], 0, tx, ty, tz, 1];
  const proj = [f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (fa + n) / (n - fa), -1, 0, 0, 2 * fa * n / (n - fa), 0];
  const vp = new Array(16).fill(0);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) for (let k = 0; k < 4; k++) vp[c * 4 + r] += proj[k * 4 + r] * view[c * 4 + k];
  return { pos, fwd, right, up, vp, f };
}

// Background gradient for this frame, into a small target (spec 17). The month's day and night images are processed in
// hue, saturation and value: the value is scaled by the lighting (a sun-like spot on an arc across the upper part and an
// opposite glow along the bottom, driven by the warped hour; the night image by its own noon-to-noon clock), lit areas
// become slightly paler, dawn and dusk darken the top and deepen its colour, and the middle of the month is a little less
// saturated. Next month's images rise from the bottom of the screen. The day image carries its own daylight factor, and
// even at full night weight the picture is a mix of the night image and the (dark) day image.
const FS_BGGEN = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uImg, uPrev; uniform float uTiles, uA, uB, uMc, uMw, uNight, uNightMix, uDaylight, uWday, uWnight;
uniform float uEase, uSpot, uGlow, uLightBase, uNightBase, uPale, uDusk, uDuskDark, uDuskSat, uMidSat;
vec3 img(float idx, vec2 uv){
  vec2 q = vec2(uv.x, (idx + clamp(uv.y, 0.5 / ${BG_H}.0, 1.0 - 0.5 / ${BG_H}.0)) / uTiles);

vec3 rgb2hsv(vec3 c){

// Wave: bicubic B-spline surface over the control net, shaded per vertex in the projected space. Every surface cell is
// drawn as its own small quad (six vertices). A cell thinner than a pixel is not widened (spec 17): it lights only the
// supersamples it covers, and with the size factor its light is faint anyway.
const VS_WAVE = `#version 300 es
precision highp float;
uniform highp sampler2D uNet0, uNet1; uniform float uAlpha;
uniform mat4 uVP; uniform int uSA, uSV;
uniform vec3 uCam, uRight, uUp, uFwd; uniform vec2 uProj; uniform float uSizeNorm;
out float vCos, vSize; out vec2 vST;
vec3 cp(ivec2 ij){ return mix(texelFetch(uNet0, ij, 0).xyz, texelFetch(uNet1, ij, 0).xyz, uAlpha); }
void basis(float t, out vec4 b, out vec4 d){

  float s = float(i + cs) / float(uSA) * ${NN - 3}.0, t = float(row + ct) / float(uSV) * ${NN - 3}.0;
  int is_ = min(int(floor(s)), ${NN - 4}), it = min(int(floor(t)), ${NN - 4});

  vec3 P = vec3(0.0), Ps = vec3(0.0), Pt = vec3(0.0);
  for (int b = 0; b < 4; b++) {
    vec3 rb = vec3(0.0), rd = vec3(0.0);
    for (int a = 0; a < 4; a++) { vec3 c = cp(ivec2(is_ + a, it + b)); rb += bs[a] * c; rd += ds[a] * c; }
    P += bt[b] * rb; Ps += bt[b] * rd; Pt += dt[b] * rb;

  // the perspective divide. The B-spline commutes with this linear map, so the surface, its derivatives and their
  // unnormalised cross product (its length the element's area there) are those of the projected surface.
  vec3 D = P - uCam;

// Per fragment, from the per-vertex cosine c and size factor S (interpolated): the light is S times the edge fade times
// the sum of two terms (spec 16 and 17). The sheen is the base level times the (fused, so flat) thread profile, flat until
// well past the size factor of the Fresnel-like peak (uCut0), then falling linearly to nearly nothing (uCut1) and fading
// out slowly after that. The Fresnel-like term is a strength times one narrow peak indexed by the product c x S: exactly
// zero over the lower part of the range below the peak (up to uFresZero of the peak's position), a steep rise to the peak,
// and a long thin tail above it (uFresTail). The edge fade is linear and covers the same fraction at the ends and edges.
const FS_WAVE = `#version 300 es
precision highp float;
in float vCos, vSize; in vec2 vST;
uniform float uBright, uBase, uFres, uCut0, uCut1, uFresPeak, uFresZero, uFresTail, uFade;

  float fres = uFres * (x < 1.0 ? r * r * (3.0 - 2.0 * r) : exp(-(x - 1.0) / uFresTail));

section('layers', 'Layers', ...LAYER_NAMES.map(([k, n]) => check(n, ...setting(k, 'layers'))));

// Wireframes
section('wire', 'Wireframes',
  check('wave surface mesh', ...setting('mesh', 'wire')),
  row('mesh lines', seg([[1, 'all'], [4, 'every 4th'], [16, 'every 16th']], ...setting('meshStride', 'wire'))),
  check('control grid', ...setting('grid', 'wire')),
  check('sparkle quads', ...setting('quads', 'wire')));

// Inspect
const levelSel = el('select'); levelSel.onchange = () => { S.inspect.level = +levelSel.value; saveSettings(); };
const gainR = el('input', { type: 'range', min: -6, max: 12, step: 0.1 }), gainVal = el('span', { class: 'val' });
gainR.oninput = () => { S.inspect.gain = Math.pow(2, +gainR.value); saveSettings(); refreshInspect(); };
let autoGain = 1;
function refreshInspect() {
  const I = S.inspect, g = I.autoGain ? autoGain : I.gain;
  if (document.activeElement !== gainR) gainR.value = Math.log2(g);
  gainR.disabled = I.autoGain; gainVal.textContent = 'x' + (g >= 10 ? g.toFixed(0) : g.toFixed(2));
  levelSel.disabled = !I.buffer.startsWith('glare');
}
syncers.push(refreshInspect);
section('inspect', 'Inspect',
  row('buffer', select(INSPECT_BUFFERS, () => S.inspect.buffer, v => { S.inspect.buffer = v; saveSettings(); })),
  row('level', levelSel),
  row('gain', gainR, gainVal),
  check('automatic gain (for faint buffers)', ...setting('autoGain', 'inspect')),
  row('stop after pass', select([[0, 'run every pass'], ...PASSES.map((p, i) => [i + 1, p])], () => S.inspect.stopAfter, v => { S.inspect.stopAfter = +v; saveSettings(); })),
  el('div', { class: 'hint', text: 'stopping before the composite shows the last buffer drawn' }));

// Parameters
function paramRow(it) {
  const r = el('input', { type: 'range', min: it.min, max: it.max, step: it.step });
  const n = el('input', { type: 'number', min: it.min, max: it.max, step: it.step });
  const reset = button('↺', () => { resetParam(it); syncPanel(); }, { class: 'reset', title: it.kind === 'mood' ? 'follow the mood again' : 'back to the default' });
  r.oninput = () => { setParam(it, +r.value); n.value = fmt(S.params[it.id], it.step); reset.disabled = false; rowEl.classList.remove('follow'); };
  n.onchange = () => { if (n.value !== '') setParam(it, +n.value); syncPanel(); };
  const rowEl = el('div', { class: 'row param' }, el('span', { class: 'lbl', text: it.label, title: it.id }), el('span', { class: 'ctl' }, r, n, reset));
  syncers.push(() => {
    const v = paramValue(it), over = S.params[it.id] != null;
    if (document.activeElement !== r) r.value = v;
    if (document.activeElement !== n) n.value = fmt(v, it.step);
    rowEl.classList.toggle('follow', it.kind === 'mood' && !over); reset.disabled = !over;
  });
  return rowEl;
}
{
  const sec = section('params', 'Parameters',
    el('div', { class: 'hint', text: 'each slider changes the picture live; a dimmed slider follows the mood of the moment until it is moved' }),
    el('div', { class: 'btns' }, button('reset all', () => { for (const it of PARAM_ITEMS) resetParam(it); syncPanel(); })));
  const body = sec.querySelector('.body');
  for (const g of PARAM_GROUPS) { body.append(el('h4', { text: g.name })); for (const it of g.items) body.append(paramRow(it)); }
}

// opening and closing
function setPanel(open) {
  panel.classList.toggle('open', open); gear.classList.toggle('open', open);
  gear.setAttribute('aria-expanded', String(open)); gear.setAttribute('aria-label', open ? 'close settings' : 'settings');
  if (open) refreshPanel();
}
gear.onclick = () => setPanel(!panel.classList.contains('open'));
panel.addEventListener('click', e => { if (e.target.tagName === 'BUTTON') e.target.blur(); }); // so Space keeps pausing after a click
window.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const tag = e.target && e.target.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if ((tag === 'BUTTON' || tag === 'SUMMARY') && (e.key === ' ' || e.key === 'Enter')) return; // keyboard activation of a focused control
  const k = e.key.toLowerCase();
  if (k === 'h' || k === 'p') setPanel(!panel.classList.contains('open'));
  else if (k === 'f') { S.fps = !S.fps; saveSettings(); syncPanel(); }
  else if (e.key === ' ') { setPaused(!paused); e.preventDefault(); }
  else if (e.key === '.' || e.key === 'ArrowRight') stepOnce();
});
let gearTimer = 0;
function pokeGear() { document.body.classList.add('active'); clearTimeout(gearTimer); gearTimer = setTimeout(() => document.body.classList.remove('active'), 2500); }
window.addEventListener('pointermove', pokeGear); window.addEventListener('pointerdown', pokeGear);
syncPanel();

// The clock display, the stats and the mood-following sliders change on their
// own, so the open panel is refreshed a few times a second.
let lastLayout = null;
function refreshPanel() {
  const d = new Date(clockNow(performance.now()));
  if (document.activeElement !== dateIn) dateIn.value = toLocalInput(d);
  if (document.activeElement !== todIn) todIn.value = d.getHours() * 60 + d.getMinutes();
  todVal.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
  if (lastLayout) scaleNote.textContent = `renders ${lastLayout.renderW} x ${lastLayout.renderH} pixels` + (lastLayout.outW !== lastLayout.renderW ? `, shown at ${lastLayout.outW} x ${lastLayout.outH}` : '');
  const n = RT ? RT.levels.length : 0;
  if (levelSel.options.length !== n) { levelSel.textContent = ''; for (let i = 0; i < n; i++) levelSel.append(el('option', { value: i, text: `${i}: ${RT.levels[i].w} x ${RT.levels[i].h}` })); }
  if (n) levelSel.value = Math.min(S.inspect.level, n - 1);
  syncPanel();
}

// ---- the picture's placement: shape, render scale and fit ----
// The picture has the chosen shape. Its display size follows the window and the
// fit; the render size is the display size times the render scale. A render
// larger than the display is averaged down in the final pass (the canvas stays
// at the display size); a smaller one is a smaller canvas that the browser
// enlarges, smoothed or not. With one-to-one pixels the canvas is the window
// and the picture is placed in it unscaled, centred.
function layout() {
  const dpr = window.devicePixelRatio || 1, winW = window.innerWidth, winH = window.innerHeight;
  const A = S.shape === '4:3' ? 4 / 3 : 16 / 9;
  const fitW = Math.min(winW, winH * A), coverW = Math.max(winW, winH * A);
  const baseW = S.fit === 'fill' ? coverW : fitW, baseH = baseW / A;          // display size in CSS px (stretch: the fitted size, stretched over the window)
  const dispW = Math.max(1, Math.round(baseW * dpr)), dispH = Math.max(1, Math.round(baseH * dpr));
  let renderW = Math.max(1, Math.round(dispW * S.scale)), renderH = Math.max(1, Math.round(dispH * S.scale));
  const k = MAX_TEX / Math.max(renderW, renderH); if (k < 1) { renderW = Math.floor(renderW * k); renderH = Math.floor(renderH * k); }
  const one = S.fit === 'one', small = one || S.scale < 1;
  const outW = small ? renderW : dispW, outH = small ? renderH : dispH;
  const ss = S.waveQuality === 'full' ? 2 : (renderW >= outW * 1.5 ? 1 : 2);
  let canvasW = outW, canvasH = outH, css, view = null;
  if (one) {
    canvasW = Math.max(1, Math.round(winW * dpr)); canvasH = Math.max(1, Math.round(winH * dpr));
    css = { left: 0, top: 0, width: winW, height: winH };
    view = { x: Math.floor((canvasW - outW) / 2), y: Math.floor((canvasH - outH) / 2) };
  } else if (S.fit === 'stretch') css = { left: 0, top: 0, width: winW, height: winH };
  else css = { left: (winW - baseW) / 2, top: (winH - baseH) / 2, width: baseW, height: baseH };
  return { dpr, dispW, dispH, renderW, renderH, outW, outH, ss, canvasW, canvasH, css, view };
}
let layoutKey = '';
function applyLayout(lay) {
  const key = [lay.canvasW, lay.canvasH, lay.css.left, lay.css.top, lay.css.width, lay.css.height, S.pixelated].join(',');
  if (key === layoutKey) return;
  layoutKey = key;
  if (canvas.width !== lay.canvasW || canvas.height !== lay.canvasH) { canvas.width = lay.canvasW; canvas.height = lay.canvasH; }
  canvas.style.left = lay.css.left + 'px'; canvas.style.top = lay.css.top + 'px';
  canvas.style.width = lay.css.width + 'px'; canvas.style.height = lay.css.height + 'px';
  canvas.style.imageRendering = S.pixelated ? 'pixelated' : 'auto';
}

// ---- GPU time per pass (EXT_disjoint_timer_query_webgl2), on request ----
const timerExt = gl.getExtension('EXT_disjoint_timer_query_webgl2');
let gpuProbe = null; // { left: frames still to time, queries: [{name, q}], sums, counts, order }
function startGpuProbe() {
  if (!timerExt) { gpuOut.textContent = 'GPU timing is not available: this browser does not expose EXT_disjoint_timer_query_webgl2.'; return; }
  gpuProbe = { left: 8, queries: [], sums: {}, counts: {}, order: [] };
  gpuOut.textContent = 'measuring…';
}
function probeTimer() { // the timer hooks for one frame: one query per pass
  let cur = null;
  return {
    begin(name) { cur = { name, q: gl.createQuery() }; gl.beginQuery(timerExt.TIME_ELAPSED_EXT, cur.q); },
    end() { gl.endQuery(timerExt.TIME_ELAPSED_EXT); gpuProbe.queries.push(cur); cur = null; },
  };
}
function pollGpuProbe() {
  const P = gpuProbe, disjoint = gl.getParameter(timerExt.GPU_DISJOINT_EXT), keep = [];
  for (const e of P.queries) {
    if (!gl.getQueryParameter(e.q, gl.QUERY_RESULT_AVAILABLE)) { keep.push(e); continue; }
    const ns = gl.getQueryParameter(e.q, gl.QUERY_RESULT); gl.deleteQuery(e.q);
    if (disjoint) continue; // the GPU clock was disturbed: this result is not trustworthy
    if (!(e.name in P.sums)) { P.sums[e.name] = 0; P.counts[e.name] = 0; P.order.push(e.name); }
    P.sums[e.name] += ns; P.counts[e.name]++;
  }
  P.queries = keep;
  if (P.left > 0 || keep.length) return;
  let total = 0; const lines = [];
  for (const name of P.order) { const ms = P.sums[name] / P.counts[name] / 1e6; total += ms; lines.push(name.padEnd(11) + ms.toFixed(3).padStart(8) + ' ms'); }
  lines.push('total'.padEnd(11) + total.toFixed(3).padStart(8) + ' ms per frame, GPU, averaged over 8 frames');
  gpuOut.textContent = lines.length > 1 ? lines.join('\n') : 'no result (the GPU clock was disturbed); try again';
  gpuProbe = null;
}

// ---- Inspect: which buffer to show ----
function inspectEntry() { // the chosen buffer, or the last buffer drawn when the frame stops before the composite
  const I = S.inspect; let b = I.buffer;
  if (b === 'output') b = I.stopAfter === 1 ? 'bg' : I.stopAfter === 2 ? 'wave' : 'glareB';
  const lv = RT.levels, level = Math.min(I.level, lv.length - 1);
  switch (b) {
    case 'bg': return { tex: RT.bgA.tex, mono: false, own: gl.LINEAR };
    case 'wave': return { tex: RT.wave.tex, mono: true, own: gl.LINEAR };
    case 'glareA': return { tex: lv[level].a.tex, mono: false, own: gl.LINEAR };
    case 'glareC': return { tex: lv[level].c.tex, mono: false, own: gl.LINEAR };
    case 'glareB': return { tex: lv[level].b.tex, mono: false, own: gl.LINEAR };
    case 'net': return { tex: netTex[1], mono: false, own: gl.NEAREST };
  }
  return null;
}
let lastPeak = 0;
function showInspect(lay, now) {
  const e = inspectEntry(); if (!e) return;
  const I = S.inspect;
  if (I.autoGain && now - lastPeak > 300) { lastPeak = now; const peak = bufferPeak(e.tex); autoGain = peak > 0 ? Math.max(1, Math.min(4096, 0.9 / peak)) : 1; }
  drawInspect(e.tex, e.mono, I.autoGain ? autoGain : I.gain, S.pixelated ? gl.NEAREST : gl.LINEAR, e.own, lay.view);
}

// ---- frame-rate counter and stats ----
const FT_N = 120, frameTimes = new Float32Array(FT_N); let ftPos = 0, fpsCount = 0, fpsT = performance.now(), fpsVal = 0, graph2d = null;
function drawFpsGraph() { // the last 120 frame times as bars; the line is 60 fps
  if (!graph2d) graph2d = fpsGraph.getContext('2d'); const g = graph2d; if (!g) return;
  const dpr = window.devicePixelRatio || 1, W = Math.round(FT_N * dpr), H = Math.round(28 * dpr), top = 50; // the graph's top is 50 ms
  if (fpsGraph.width !== W || fpsGraph.height !== H) { fpsGraph.width = W; fpsGraph.height = H; }
  g.clearRect(0, 0, W, H);
  const bw = W / FT_N;
  for (let i = 0; i < FT_N; i++) {
    const t = frameTimes[(ftPos + i) % FT_N]; if (!t) continue;
    const h = Math.min(1, t / top) * H;
    g.fillStyle = t <= 17.5 ? '#6c6' : t <= 34 ? '#dc5' : '#e55';
    g.fillRect(i * bw, H - h, Math.max(1, bw - 0.5 * dpr), h);
  }
  g.fillStyle = 'rgba(255,255,255,.5)'; g.fillRect(0, Math.round(H - H * 16.67 / top), W, 1);
}
function statsText(lay) {
  let sum = 0, n = 0; for (let i = 0; i < FT_N; i++) if (frameTimes[i]) { sum += frameTimes[i]; n++; }
  const ss = RT.ww / lay.renderW;
  return [
    `render ${lay.renderW} x ${lay.renderH}`,
    `wave buffer ${RT.ww} x ${RT.wh} (${ss >= 1.95 ? '2x supersampled' : ss > 1.05 ? ss.toFixed(2) + 'x, texture limit' : '1 sample per render pixel'})`,
    `output ${lay.outW} x ${lay.outH}${lay.outW !== lay.canvasW || lay.outH !== lay.canvasH ? `, canvas ${lay.canvasW} x ${lay.canvasH}` : ''}`,
    `glare ${RT.levels[0].w} x ${RT.levels[0].h}, ${RT.levels.length} levels`,
    `sim step ${latest && latest.stepMs != null ? latest.stepMs.toFixed(2) + ' ms' : '-'} (worker), wave speed ${S.waveSpeed}x`,
    `frame ${n ? (sum / n).toFixed(1) : '-'} ms, cap ${S.fpsCap ? S.fpsCap + ' fps' : 'display rate'}`,
    `${S.shape} ${S.fit}, scale ${S.scale}x, wave buffer ${S.waveQuality}, pixelated ${S.pixelated ? 'on' : 'off'}`,
  ].join('\n');
}
let lastRefresh = 0;
function fpsTick(now, lay) {
  fpsCount++;
  if (now - fpsT > 500) {
    fpsVal = fpsCount * 1000 / (now - fpsT); fpsCount = 0; fpsT = now;
    if (S.stats) statsEl.textContent = statsText(lay);
  }
  fpsEl.classList.toggle('on', S.fps || S.stats);
  fpsText.hidden = fpsGraph.hidden = !S.fps; statsEl.hidden = !S.stats;
  if (S.fps) { fpsText.textContent = fpsVal.toFixed(0) + ' fps'; drawFpsGraph(); }
  if (panel.classList.contains('open') && now - lastRefresh > 250) { lastRefresh = now; refreshPanel(); }
}

// screen wake lock
let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && !document.hidden && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) { wakeLock = null; }
}
keepAwake();
window.addEventListener('pointerdown', keepAwake);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { worker.postMessage({ type: 'run', on: false }); }
  else { worker.postMessage({ type: 'run', on: !paused }); keepAwake(); lastDraw = 0; schedule(); }
});

// a lost WebGL context (memory pressure on a tablet): stop drawing, reload when it comes back
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); worker.postMessage({ type: 'run', on: false }); }, false);
canvas.addEventListener('webglcontextrestored', () => { location.reload(); }, false);

// draw loop (capped at 60 fps unless the cap says otherwise)
let lastDraw = 0, frameNo = 0, rafPending = false, firstState = 0;
function schedule() { if (!rafPending) { rafPending = true; requestAnimationFrame(tick); } }
function tick(now) {
  rafPending = false;
  if (document.hidden) return;
  schedule();
  if (S.fpsCap && now - lastDraw < 1000 / S.fpsCap - 1.5) return;
  if (lastDraw) { frameTimes[ftPos] = now - lastDraw; ftPos = (ftPos + 1) % FT_N; }
  lastDraw = now;
  const lay = lastLayout = layout();
  applyLayout(lay);
  ensureTargets(lay.renderW, lay.renderH, lay.outW, lay.outH, lay.ss);
  const scene = currentScene(now);
  const cam = cameraFor(scene.mood.camPitch, lay.renderW / lay.renderH);
  const ms = JSON.stringify(simMoodParams(scene.mood, cam), (k, v) => typeof v === 'number' ? +v.toFixed(3) : v);
  if (ms !== lastMoodSent) { worker.postMessage({ type: 'mood', mood: JSON.parse(ms) }); lastMoodSent = ms; }
  if (tunePending) { worker.postMessage({ type: 'tune', values: simTuneMap() }); tunePending = false; }
  if (lay.view) { bindTarget(null); gl.viewport(0, 0, lay.canvasW, lay.canvasH); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); } // the canvas around the picture
  const ease = S.layers.bgEase ? BG_EASE : 1;
  const I = S.inspect, stopAfter = I.stopAfter || undefined, inspecting = I.buffer !== 'output' || (I.stopAfter > 0 && I.stopAfter < 4);
  if (!latest) { // the worker is still warming up: show the background alone
    renderFrame({ scene, cam, net0: null, net1: null, alpha: 1, sparks: null, nSparks: 0,
      layers: { ...S.layers, wave: false, glare: false, sparkles: false }, frameNo: frameNo++, ease, view: lay.view }, null);
    fpsTick(now, lay);
    return;
  }
  const alpha = paused ? 1 : Math.min(1, latest.alpha + (performance.timeOrigin + now - latest.at) / 1000 / DT * S.waveSpeed);
  if (!firstState) firstState = now;
  const fadeIn = Math.min(1, (now - firstState) / 1200); // the wave and sparkles fade in over the first second
  if (fadeIn < 1) { scene.mood = { ...scene.mood, waveBright: scene.mood.waveBright * fadeIn, sparkBright: scene.mood.sparkBright * fadeIn, glareStrength: scene.mood.glareStrength * fadeIn }; }
  const W = S.wire, wire = W.mesh || W.grid || W.quads ? { ...W, meshSA: 16 * WAVE.samplesAlong / W.meshStride, meshSV: 16 * WAVE.samplesAcross / W.meshStride } : null;
  const timer = gpuProbe && gpuProbe.left > 0 ? (gpuProbe.left--, probeTimer()) : null;
  renderFrame({ scene, cam, net0: latest.net0, net1: latest.net1, alpha, sparks: latest.sparks, nSparks: latest.n,
    layers: S.layers, frameNo: frameNo++, ease, view: lay.view, stopAfter, timer, wire }, null);
  if (inspecting) showInspect(lay, now);
  if (gpuProbe) pollGpuProbe();
  fpsTick(now, lay);
}
schedule();
})();
</script>
