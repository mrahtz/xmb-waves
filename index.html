<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; -webkit-user-select: none; user-select: none; }
  /* the picture: placed and sized by the Picture settings (see layout() in the script) */
  #c { display: block; position: fixed; left: 0; top: 0; }
  /* the round settings button: a menu icon while the panel is closed, a close icon while it is open */
  #gear { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); z-index: 3;
    width: 40px; height: 40px; border-radius: 20px; border: 0; padding: 0; background: rgba(10, 12, 18, .55); color: #fff;
    opacity: 0; transition: opacity .4s; cursor: pointer; display: grid; place-items: center;

  #panel details { border-top: 1px solid rgba(255, 255, 255, .12); }

  #panel summary::-webkit-details-marker { display: none; }
  #panel summary::before { content: ''; width: 6px; height: 6px; margin-left: 2px; border-right: 2px solid #ccc; border-bottom: 2px solid #ccc;
    transform: rotate(-45deg); transition: transform .15s; }
  #panel details[open] > summary::before { transform: rotate(45deg); }

// Simulation module: the wave's spring net, its free-form deformation, and the
// sparkle pool. Pure JavaScript with no DOM access, so the same source runs in a
// Web Worker (normal mode) and on the main thread (deterministic score mode).
function XMBW_SIM() {
  'use strict';
  const N = 19;            // control grid, N x N points
  const DT = 1 / 60;       // fixed step
  const H = 1 / (N - 1);   // grid spacing in net units (the net is a unit square)

  // ---- tunables (all original design values) ----
  const NET = {
    kStruct: 0.398, kBend: 1.375,    // spring constants along the length (unit masses); the bending springs are about
                                    // four and a half times stiffer than the direct ones
    alongRest: 1.0,                 // rest length of the along-springs relative to the grid spacing: 1.0 keeps the
                                    // sheet smooth; above 1 the slack buckles into standing wrinkles (wirier than the reference)
    acrossK: 0.9862,                 // the across-the-width springs are comparable to the along ones (a little stiffer); with the
                                    // stiffer bending springs this makes the picture hold together longer from second to second
    damping: 0.000139,              // fraction of velocity removed per step: light, a decay time of 120 s, two cycles of the
                                    // slower drive motion (spec 14); folds launched at the shaken end still travel at the free end
    noise: 2.734e-05,                  // velocity kick per step (std dev). Besides keeping the motion alive, the kicks set how
                                    // many strands the band shows: the across-the-width springs have no linear stiffness at
                                    // rest length, so the kicks drive neighbouring rows apart into separate strands; 3.5e-4 gives
                                    // the reference's 3-4 brightness peaks and about 0.8 dark partings per column, 2e-5 a broad
                                    // ribbon of two or three layers whose lines stand too high above the band; much larger values
                                    // make the net jitter and the fold lines stipple
    push: 0.004559,                    // steady gentle pull on the free end, along the length, so the sheet stays extended
    // the drive (spec 14, fixed, not tuned): slow (each swing several times longer than the swell's crossing), each end
    // moving less than a grid spacing (0.056), up-and-down travel twice the towards-and-away, which is the faster motion
    driveA: 0.040, driveW1: 0.1047,   // driven end: height amplitude, angular frequency (a 60 s cycle)
    driveB: 0.020, driveW2: 0.1571,   // driven end: depth amplitude, angular frequency (a 40 s cycle)
    drivePhase1: 1.139, drivePhase2: 1.804,  // phase change per row for height and depth: the driven points are strung out along the
                                          // shared path (about 1.1 cycles across the edge in height, 2.4 in depth); the depth offset builds up more
                                          // than the height offset, and that difference between the axes is what makes the folds cross
    driveEase: 0.02,                // easing of the driving clock towards sim time
    envLow: 0.85, envWidth: 0.30,   // envelope along the length: subdued level, transition half-width
    warm: 6000,                     // warm-up steps before frame 0, at least. Without a stored state the lightly damped net
                                    // needs several decay times to settle into its running state from the flat start, so the
                                    // warm-up runs warmDecays of them (the first warmSettle steps with heavy damping)
    warmSettle: 1500, warmDecays: 3,

  const LAT = { nu: 10, nv: 4, nw: 4,
    spread: 5.643,                    // uneven layout along the length: the cells at the free end are this many times longer than
                                    // at the shaken end (fixed), so the free end of the net covers far more of the scene
    // The vertical displacement is the sum of four slow parts, computed directly from the clock (rates in rad/s):
    // a wave rolling from the shaken end to the free end, growing along the length, whose strength swells and fades.
    // It is the swell: its crest crossing the screen is the band's slow left-to-right rise and fall

    // one soft hump sliding back and forth along the length (centre and travel as fractions of the length; part of
    // its travel lies beyond the shaken end)
    bumpAmp: 0.005516, bumpWidth: 0.25, bumpCentre: 0.25, bumpTravel: 0.5, bumpW: 0.037,
    bobAmp: 0.012, bobW: 0.071,     // the whole sheet rising and falling together, much more slowly than the swell
    twistAmp: 0.01214, twistW: 0.21,  // a gentle ripple, one cycle across the width, travelling across it
  };

  const SCENE = { len: 12.15, x0: 0.7873, wid: 5.618, height: 2.075, y0: 0.05, z0: 0.0, tilt: 0.0 }; // tilt: rise per unit length towards the near end

  const SPARK = {
    pool: 2000,
    // births (spec 16): bursts on a large share of the steps, each a fixed batch at random points of the sheet, supply nearly
    // all of them; a single walker leaves a trail along the length, one sparkle every other step, and its births come after
    // the bursts' so they are the ones dropped once the pool is full

    let s = seed >>> 0;

// ---------------------------------------------------------------------------
// Camera (original design): looks across the sheet from in front, yawed so the
// sheet is seen obliquely and pitched down a little; the pitch follows the mood.
// ---------------------------------------------------------------------------
const CAMERA = { fovY: 64.4, yaw: -20, dist: 3.161, target: [0.8, 0.30, 0.0], near: 0.1, far: 40 }; // far back with a narrow view, so near and far parts look alike
function cameraFor(pitchDeg, aspect) {
  const d2r = Math.PI / 180, p = pitchDeg * d2r, yw = CAMERA.yaw * d2r;
  const fwd = [Math.sin(yw) * Math.cos(p), -Math.sin(p), Math.cos(yw) * Math.cos(p)];
  const right = [Math.cos(yw), 0, -Math.sin(yw)];
  const up = [fwd[1] * right[2] - fwd[2] * right[1], fwd[2] * right[0] - fwd[0] * right[2], fwd[0] * right[1] - fwd[1] * right[0]];
  const pos = CAMERA.target.map((t, i) => t - CAMERA.dist * fwd[i]);
  const f = 1 / Math.tan(CAMERA.fovY * d2r / 2), n = CAMERA.near, fa = CAMERA.far;
  // view: rows right, up, -fwd (right-handed clip convention); column-major for GL
  const tx = -(right[0] * pos[0] + right[1] * pos[1] + right[2] * pos[2]);
  const ty = -(up[0] * pos[0] + up[1] * pos[1] + up[2] * pos[2]);
  const tz = (fwd[0] * pos[0] + fwd[1] * pos[1] + fwd[2] * pos[2]);
  const view = [right[0], up[0], -fwd[0], 0, right[1], up[1], -fwd[1], 0, right[2], up[2], -fwd[2], 0, tx, ty, tz, 1];
  const proj = [f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (fa + n) / (n - fa), -1, 0, 0, 2 * fa * n / (n - fa), 0];
  const vp = new Array(16).fill(0);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) for (let k = 0; k < 4; k++) vp[c * 4 + r] += proj[k * 4 + r] * view[c * 4 + k];
  return { pos, fwd, right, up, vp, f };
}

// Wave: bicubic B-spline surface over the control net, shaded by view angle.
// Every surface cell is drawn as its own small quad (six vertices), so its corners
// are free to move. Where a cell would be thinner on screen than one pixel in some
// direction (folds seen edge-on, the far end), its corners are pushed apart to one
// pixel in that direction and its light is scaled by the true size: every cell then
// covers whole pixels, overlapping cells add up to the right total, and nothing is
// lost to pixel centres falling between slivers (no dotted or crawling lines).
const VS_WAVE = `#version 300 es
precision highp float;
uniform highp sampler2D uNet0, uNet1; uniform float uAlpha;
uniform mat4 uVP; uniform int uSA, uSV; uniform vec2 uRes; uniform float uMinW;
uniform vec3 uCam, uRight, uUp, uFwd; uniform vec2 uProj; uniform float uSizeNorm;
out float vCos, vSize; out vec2 vST; out float vWidth;
vec3 cp(ivec2 ij){ return mix(texelFetch(uNet0, ij, 0).xyz, texelFetch(uNet1, ij, 0).xyz, uAlpha); }
void basis(float t, out vec4 b, out vec4 d){

// the sum of two terms. The sheen is the base level times the (fused, so flat) thread profile, which is cut off where
// S is large: bits of sheet that appear large on screen (near, face-on, big cells) carry no sheen. The Fresnel-like
// term is a strength times one narrow peak indexed by the product c x S: nothing exactly edge-on, a steep rise to the
// peak, nothing from moderate values up. It is the soft strip just inside every edge-on turn, nearer the turn where S
// is large. The cell's true size also scales the light where it was widened (see the vertex shader).
const FS_WAVE = `#version 300 es

uniform sampler2D uBg; uniform vec2 uBgSize;
vec3 bicubicBg(vec2 uv){

  vec2 p0 = (h0 + 0.5) / uBgSize, p1 = (h1 + 0.5) / uBgSize;

// Down-filter over the supersampled wave buffer: a box exactly one destination pixel wide (n x n bilinear taps over
// uWTexel, the destination pixel size in uv, times uWSpread = 1).
const GLSL_WAVEBOX = `
uniform sampler2D uWave; uniform vec2 uWTexel; uniform int uWTaps; uniform float uWSpread;

    for (int i = 0; i < 4; i++) { if (i >= uWTaps) break;

      s += texture(uWave, uv + off * uWTexel).r; } }

const FS_BRIGHT = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;

let layoutKey = '';

  canvas.style.left = lay.css.left + 'px'; canvas.style.top = lay.css.top + 'px';
  canvas.style.width = lay.css.width + 'px'; canvas.style.height = lay.css.height + 'px';

// ---- GPU time per pass (EXT_disjoint_timer_query_webgl2), on request ----
const timerExt = gl.getExtension('EXT_disjoint_timer_query_webgl2');

function startGpuProbe() {

  gpuProbe = { left: 8, queries: [], sums: {}, counts: {}, order: [] };
  gpuOut.textContent = 'measuring…';
}

    end() { gl.endQuery(timerExt.TIME_ELAPSED_EXT); gpuProbe.queries.push(cur); cur = null; },

}

// ---- Inspect: which buffer to show ----
function inspectEntry() { // the chosen buffer, or the last buffer drawn when the frame stops before the composite
  const I = S.inspect; let b = I.buffer;
  if (b === 'output') b = I.stopAfter === 1 ? 'bg' : I.stopAfter === 2 ? 'wave' : 'glareB';
  const lv = RT.levels, level = Math.min(I.level, lv.length - 1);
  switch (b) {
    case 'bg': return { tex: RT.bgA.tex, mono: false, own: gl.LINEAR };
    case 'wave': return { tex: RT.wave.tex, mono: true, own: gl.LINEAR };
    case 'glareA': return { tex: lv[level].a.tex, mono: false, own: gl.LINEAR };
    case 'glareC': return { tex: lv[level].c.tex, mono: false, own: gl.LINEAR };
    case 'glareB': return { tex: lv[level].b.tex, mono: false, own: gl.LINEAR };

let lastPeak = 0;
function showInspect(lay, now) {
  const e = inspectEntry(); if (!e) return;
  const I = S.inspect;
  if (I.autoGain && now - lastPeak > 300) { lastPeak = now; const peak = bufferPeak(e.tex); autoGain = peak > 0 ? Math.max(1, Math.min(4096, 0.9 / peak)) : 1; }
  drawInspect(e.tex, e.mono, I.autoGain ? autoGain : I.gain, S.pixelated ? gl.NEAREST : gl.LINEAR, e.own, lay.view);
}

// ---- frame-rate counter and stats ----
const FT_N = 120, frameTimes = new Float32Array(FT_N); let ftPos = 0, fpsCount = 0, fpsT = performance.now(), fpsVal = 0, graph2d = null;
function drawFpsGraph() { // the last 120 frame times as bars; the line is 60 fps
  if (!graph2d) graph2d = fpsGraph.getContext('2d'); const g = graph2d; if (!g) return;
  const dpr = window.devicePixelRatio || 1, W = Math.round(FT_N * dpr), H = Math.round(28 * dpr), top = 50; // the graph's top is 50 ms
  if (fpsGraph.width !== W || fpsGraph.height !== H) { fpsGraph.width = W; fpsGraph.height = H; }
  g.clearRect(0, 0, W, H);
  const bw = W / FT_N;
  for (let i = 0; i < FT_N; i++) {
    const t = frameTimes[(ftPos + i) % FT_N]; if (!t) continue;
    const h = Math.min(1, t / top) * H;
    g.fillStyle = t <= 17.5 ? '#6c6' : t <= 34 ? '#dc5' : '#e55';
    g.fillRect(i * bw, H - h, Math.max(1, bw - 0.5 * dpr), h);
  }
  g.fillStyle = 'rgba(255,255,255,.5)'; g.fillRect(0, Math.round(H - H * 16.67 / top), W, 1);
}
function statsText(lay) {
  let sum = 0, n = 0; for (let i = 0; i < FT_N; i++) if (frameTimes[i]) { sum += frameTimes[i]; n++; }
  const ss = RT.ww / lay.renderW;
  return [
    `render ${lay.renderW} x ${lay.renderH}`,
    `wave buffer ${RT.ww} x ${RT.wh} (${ss >= 1.95 ? '2x supersampled' : ss > 1.05 ? ss.toFixed(2) + 'x, texture limit' : '1 sample per render pixel'})`,
    `output ${lay.outW} x ${lay.outH}${lay.outW !== lay.canvasW || lay.outH !== lay.canvasH ? `, canvas ${lay.canvasW} x ${lay.canvasH}` : ''}`,
    `glare ${RT.levels[0].w} x ${RT.levels[0].h}, ${RT.levels.length} levels`,
    `sim step ${latest && latest.stepMs != null ? latest.stepMs.toFixed(2) + ' ms' : '-'} (worker), wave speed ${S.waveSpeed}x`,
    `frame ${n ? (sum / n).toFixed(1) : '-'} ms, cap ${S.fpsCap ? S.fpsCap + ' fps' : 'display rate'}`,
    `${S.shape} ${S.fit}, scale ${S.scale}x, wave buffer ${S.waveQuality}, pixelated ${S.pixelated ? 'on' : 'off'}`,
  ].join('\n');
}
let lastRefresh = 0;
function fpsTick(now, lay) {
  fpsCount++;
  if (now - fpsT > 500) {
    fpsVal = fpsCount * 1000 / (now - fpsT); fpsCount = 0; fpsT = now;
    if (S.stats) statsEl.textContent = statsText(lay);
  }
  fpsEl.classList.toggle('on', S.fps || S.stats);
  fpsText.hidden = fpsGraph.hidden = !S.fps; statsEl.hidden = !S.stats;
  if (S.fps) { fpsText.textContent = fpsVal.toFixed(0) + ' fps'; drawFpsGraph(); }
  if (panel.classList.contains('open') && now - lastRefresh > 250) { lastRefresh = now; refreshPanel(); }
}

// screen wake lock
let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && !document.hidden && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) { wakeLock = null; }
}
keepAwake();
window.addEventListener('pointerdown', keepAwake);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { worker.postMessage({ type: 'run', on: false }); }
  else { worker.postMessage({ type: 'run', on: !paused }); keepAwake(); lastDraw = 0; schedule(); }
});

// a lost WebGL context (memory pressure on a tablet): stop drawing, reload when it comes back
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); worker.postMessage({ type: 'run', on: false }); }, false);
canvas.addEventListener('webglcontextrestored', () => { location.reload(); }, false);

// draw loop (capped at 60 fps unless the cap says otherwise)
let lastDraw = 0, frameNo = 0, rafPending = false, firstState = 0;
function schedule() { if (!rafPending) { rafPending = true; requestAnimationFrame(tick); } }
function tick(now) {

  applyLayout(lay);
  ensureTargets(lay.renderW, lay.renderH, lay.outW, lay.outH, lay.ss);

  const cam = cameraFor(scene.mood.camPitch, lay.renderW / lay.renderH);
  const ms = JSON.stringify(simMoodParams(scene.mood, cam), (k, v) => typeof v === 'number' ? +v.toFixed(3) : v);

  const ease = S.layers.bgEase ? BG_EASE : 1;
  const I = S.inspect, stopAfter = I.stopAfter || undefined, inspecting = I.buffer !== 'output' || (I.stopAfter > 0 && I.stopAfter < 4);
  if (!latest) { // the worker is still warming up: show the background alone
    renderFrame({ scene, cam, net0: null, net1: null, alpha: 1, sparks: null, nSparks: 0,
      layers: { ...S.layers, wave: false, glare: false, sparkles: false }, frameNo: frameNo++, ease, view: lay.view }, null);

  if (!firstState) firstState = now;

  if (fadeIn < 1) { scene.mood = { ...scene.mood, waveBright: scene.mood.waveBright * fadeIn, sparkBright: scene.mood.sparkBright * fadeIn, glareStrength: scene.mood.glareStrength * fadeIn }; }
  const W = S.wire, wire = W.mesh || W.grid || W.quads ? { ...W, meshSA: 16 * WAVE.samplesAlong / W.meshStride, meshSV: 16 * WAVE.samplesAcross / W.meshStride } : null;
  const timer = gpuProbe && gpuProbe.left > 0 ? (gpuProbe.left--, probeTimer()) : null;
  renderFrame({ scene, cam, net0: latest.net0, net1: latest.net1, alpha, sparks: latest.sparks, nSparks: latest.n,
    layers: S.layers, frameNo: frameNo++, ease, view: lay.view, stopAfter, timer, wire }, null);
  if (inspecting) showInspect(lay, now);

schedule();
})();
