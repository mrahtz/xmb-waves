<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Waves">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>xmb-waves</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; -webkit-user-select: none; user-select: none; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; }
  #gear { position: fixed; right: max(10px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom));
    width: 36px; height: 36px; border-radius: 18px; border: 0; background: rgba(0,0,0,.35); color: #fff; font-size: 20px;
    opacity: 0; transition: opacity .4s; cursor: pointer; }
  body.active #gear, #panel.open ~ #gear { opacity: .8; }
  #panel { position: fixed; right: max(10px, env(safe-area-inset-right)); bottom: calc(max(10px, env(safe-area-inset-bottom)) + 44px);
    font: 13px/1.5 system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.6); padding: 10px 12px; border-radius: 10px;
    display: none; min-width: 220px; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  #panel.open { display: block; }
  #panel label { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin: 3px 0; }
  #panel .row { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  #panel .row label { margin: 0; }
  #panel input, #panel select, #panel button { font: inherit; }
  #fps { position: fixed; left: max(8px, env(safe-area-inset-left)); top: max(8px, env(safe-area-inset-top));
    font: 12px/1 ui-monospace, monospace; color: #fff; background: rgba(0,0,0,.45); padding: 4px 6px; border-radius: 4px; display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fps"></div>
<div id="panel">
  <label>theme <select id="pTheme"></select></label>
  <label><span><input id="pFixed" type="checkbox"> fixed time</span> <input id="pTime" type="datetime-local"></label>
  <label>time speed <select id="pSpeed"><option value="1">1x</option><option value="60">60x</option><option value="600">600x</option><option value="3600">3600x</option></select></label>
  <label>render scale <span><input id="pScale" type="range" min="0" max="4" step="0.25"> <span id="pScaleV"></span></span></label>
  <div class="row"><button id="pPause">pause</button><button id="pStep">step</button>
    <label><input id="pFps" type="checkbox"> fps</label></div>
  <div class="row">
    <label><input id="pL_bg" type="checkbox">bg</label><label><input id="pL_wave" type="checkbox">wave</label>
    <label><input id="pL_glare" type="checkbox">glare</label><label><input id="pL_sparkles" type="checkbox">sparkles</label>
    <label><input id="pL_dither" type="checkbox">dither</label></div>
</div>
<button id="gear" aria-label="settings">&#9881;</button>
<script>
// Simulation module: the wave's spring net, its free-form deformation, and the
// sparkle pool. Pure JavaScript with no DOM access, so the same source runs in a
// Web Worker (normal mode) and on the main thread (deterministic score mode).
function XMBW_SIM() {
  'use strict';
  const N = 19;            // control grid, N x N points
  const DT = 1 / 60;       // fixed step
  const H = 1 / (N - 1);   // grid spacing in net units (the net is a unit square)

  // ---- tunables (all original design values) ----
  const NET = {
    kStruct: 1.0, kBend: 5.0,      // spring constants along the length (unit masses)
    acrossK: 0.25,                  // the across-the-width springs are this much softer, so pleats persist along the length
    damping: 0.0015,                // fraction of velocity removed per step (low, so the folds persist along the length)
    noise: 0.0006,                  // velocity kick per step (std dev)
    push: 0.10,                     // steady pull on the free end, along the length
    driveA: 0.060, driveW1: 0.85,   // driven end: height amplitude, angular frequency
    driveB: 0.070, driveW2: 0.50,   // driven end: depth amplitude, angular frequency
    driveMix: 0.7,                  // the second family also moves the driven end in height, at this fraction of driveA, so its fold lines show and cross the first family's
    drivePhase1: 1.20, drivePhase2: -0.80, // phase change per row: the driven edge is folded across its width (about 3.5 folds); the two
                                          // families run opposite ways across, so their fold lines cross
    driveEase: 0.02,                // easing of the driving clock towards sim time
    envLow: 0.85, envWidth: 0.30,   // envelope along the length: subdued level, transition half-width
    warm: 1500,                     // warm-up steps before frame 0
  };
  // Free-form deformation lattice: more cells along the length than across or in depth.
  const LAT = { nu: 10, nv: 4, nw: 4, ease: 0.02,
    // sways: [amplitude, spatial freq (rad per unit u), temporal freq (rad/s), depth variation]
    sways: [[0.050, 3.1, 0.082, 0.8], [0.045, 5.3, -0.130, 1.0], [0.020, 8.9, 0.190, 0.7]],
    bump: { amp: 0.020, width: 0.18, speed: 0.021 },
  };
  // Scene mapping of the deformed net (scene units; x along the length, y up, z away).
  const SCENE = { len: 10, wid: 3.0, height: 7.0, y0: 0.05, z0: 0.0, tilt: 0.0 }; // tilt: rise per unit length towards the near end

  const SPARK = {
    pool: 2000,
    burstP: 0.30, burstMin: 1, burstMax: 9,        // per step
    walkers: 6, walkerP: 0.05, walkMin: 40, walkMax: 220, walkStep: 0.045, // patches per step
    cone: 0.35, reverseP: 0.12,
    speedK: 0.32, speedPow: 0.5, speedMin: 0.035, // scene units / s
    rateMean: 1 / 6.5, rateSpread: 0.30, rateMin: 1 / 14, // life per second
    rampIn: 0.06, rampOut: 0.16,
    jitter: 0.045, gravity: 0.004, friction: 0.22,  // per second units
    spinA: 2.2, spinF: [0.21, 0.37],                // rad/s amplitude, oscillation freq range (rad/s)
    box: [[-7, 7], [-3.0, 3.2], [-3.5, 5.0]],
  };
  const SPARK_STRIDE = 11; // prev xyz, cur xyz, facing xyz, opacity, random

  function mulberry(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0; let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash32(a) {
    a |= 0; a = (a ^ 61) ^ (a >>> 16); a = Math.imul(a, 9); a ^= a >>> 4;
    a = Math.imul(a, 0x27d4eb2d); a ^= a >>> 15; return a >>> 0;
  }

  // Uniform cubic B-spline basis and derivative.
  function bsp(t, out) {
    const t2 = t * t, t3 = t2 * t, u = 1 - t;
    out[0] = u * u * u / 6; out[1] = (3 * t3 - 6 * t2 + 4) / 6;
    out[2] = (-3 * t3 + 3 * t2 + 3 * t + 1) / 6; out[3] = t3 / 6;
    return out;
  }

  function createSim(seed) {
    const rng = mulberry(hash32(seed ^ 0x5eed1234) ^ 0x9e3779b9);
    const gauss = () => { let u = rng(); if (u < 1e-12) u = 1e-12; return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185307179586 * rng()); };
    const NP = N * N;
    const pos = new Float64Array(NP * 3), vel = new Float64Array(NP * 3), acc = new Float64Array(NP * 3);
    const rest = new Float64Array(NP * 3);
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const k = (j * N + i) * 3; rest[k] = i * H; rest[k + 1] = 0; rest[k + 2] = j * H;
      pos[k] = rest[k]; pos[k + 2] = rest[k + 2];
    }
    // springs: [a, b, rest, k]
    const springs = [];
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const a = j * N + i;
      if (i + 1 < N) springs.push([a, a + 1, H, NET.kStruct]);
      if (j + 1 < N) springs.push([a, a + N, H, NET.kStruct * NET.acrossK]);
      if (i + 2 < N) springs.push([a, a + 2, 2 * H, NET.kBend]);
      if (j + 2 < N) springs.push([a, a + 2 * N, 2 * H, NET.kBend * NET.acrossK]);
    }
    const SA = Int32Array.from(springs.map(s => s[0])), SB = Int32Array.from(springs.map(s => s[1]));
    const SR = Float64Array.from(springs.map(s => s[2])), SK = Float64Array.from(springs.map(s => s[3]));

    // lattice displacement values (vertical), eased towards targets
    const NL = LAT.nu * LAT.nv * LAT.nw;
    const lat = new Float64Array(NL);
    const latPh = LAT.sways.map(() => [rng() * 6.2832, rng() * 6.2832]);
    const bumpPh = rng();

    let simTime = rng() * 1000, driveT = simTime, steps = 0;
    const mood = { envCross: 0.55, latScale: [1, 1, 1], camFwd: [-0.34, -0.12, 0.93] };

    // deformed scene-space nets (previous and current step)
    let netPrev = new Float32Array(NP * 3), netCur = new Float32Array(NP * 3);

    // sparkle pool
    const S = SPARK.pool;
    const sp = new Float64Array(S * 3), sv = new Float64Array(S * 3), spPrev = new Float64Array(S * 3);
    const sq = new Float64Array(S * 4), sAge = new Float64Array(S), sRate = new Float64Array(S);
    const sSpin = new Float64Array(S * 6), sRnd = new Float64Array(S);
    const alive = new Uint8Array(S);
    const free = new Int32Array(S); let nFree = S;
    for (let i = 0; i < S; i++) free[i] = S - 1 - i;
    const walkers = [];
    for (let w = 0; w < SPARK.walkers; w++) walkers.push({ on: false, s: 0, t: 0, dir: 1, left: 0 });

    function latticeTargets() {
      const T = simTime;
      for (let iw = 0; iw < LAT.nw; iw++) for (let iv = 0; iv < LAT.nv; iv++) for (let iu = 0; iu < LAT.nu; iu++) {
        const u = (iu - 1) / (LAT.nu - 3), w = (iw - 1) / (LAT.nw - 3), v = (iv - 1) / (LAT.nv - 3);
        let d = 0;
        for (let m = 0; m < LAT.sways.length; m++) {
          const s = LAT.sways[m];
          d += s[0] * (1 + s[3] * (w - 0.5) + 0.1 * (v - 0.5)) * Math.sin(s[1] * u + s[2] * T + latPh[m][0] + 0.8 * s[3] * w);
        }
        const ub = (((T * LAT.bump.speed + bumpPh) % 1) + 1) % 1 * 1.8 - 0.4;
        const du = (u - ub) / LAT.bump.width;
        d += LAT.bump.amp * Math.exp(-du * du) * (1 + 0.3 * (w - 0.5));
        const k = (iw * LAT.nv + iv) * LAT.nu + iu;
        lat[k] += (d - lat[k]) * LAT.ease;
      }
    }
    function latticeInit() { const e = LAT.ease; LAT.ease = 1; latticeTargets(); LAT.ease = e; }

    const bu = [0, 0, 0, 0], bv = [0, 0, 0, 0], bw = [0, 0, 0, 0];
    function ffd(u, v, w) { // tricubic B-spline blend of lattice values at normalised coords
      const fu = Math.min(Math.max(u, 0), 1) * (LAT.nu - 3), fv = Math.min(Math.max(v, 0), 1) * (LAT.nv - 3), fw = Math.min(Math.max(w, 0), 1) * (LAT.nw - 3);
      const iu = Math.min(Math.floor(fu), LAT.nu - 4), iv = Math.min(Math.floor(fv), LAT.nv - 4), iw = Math.min(Math.floor(fw), LAT.nw - 4);
      bsp(fu - iu, bu); bsp(fv - iv, bv); bsp(fw - iw, bw);
      let d = 0;
      for (let c = 0; c < 4; c++) for (let b = 0; b < 4; b++) {
        const wbc = bv[b] * bw[c]; const base = ((iw + c) * LAT.nv + (iv + b)) * LAT.nu + iu;
        d += wbc * (bu[0] * lat[base] + bu[1] * lat[base + 1] + bu[2] * lat[base + 2] + bu[3] * lat[base + 3]);
      }
      return d;
    }
    function smooth(e0, e1, x) { const t = Math.min(Math.max((x - e0) / (e1 - e0), 0), 1); return t * t * (3 - 2 * t); }

    // net -> envelope -> FFD -> scene
    function deform(out) {
      const ls = mood.latScale;
      for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
        const k = (j * N + i) * 3;
        const fx = i / (N - 1);
        const env = NET.envLow + (1 - NET.envLow) * smooth(mood.envCross - NET.envWidth, mood.envCross + NET.envWidth, fx);
        const x = pos[k];
        const y = (pos[k + 1] - rest[k + 1]) * env;
        const z = rest[k + 2] + (pos[k + 2] - rest[k + 2]) * env;
        // lattice normalised coords: the lattice spans the net's region with a margin
        const u = (x + 0.1) / 1.2, v = (y + 0.5), w = (z + 0.1) / 1.2;
        const dy = ffd(u, v, w);
        out[k] = (x - 0.5) * SCENE.len * ls[0];
        out[k + 1] = (y + dy) * SCENE.height * ls[1] + SCENE.y0 + SCENE.tilt * out[k];
        out[k + 2] = (z - 0.5) * SCENE.wid * ls[2] + SCENE.z0;
      }
    }

    function stepNet() {
      acc.fill(0);
      for (let s = 0; s < SA.length; s++) {
        const a = SA[s] * 3, b = SB[s] * 3;
        const dx = pos[b] - pos[a], dy = pos[b + 1] - pos[a + 1], dz = pos[b + 2] - pos[a + 2];
        const L = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1e-9;
        const f = SK[s] * (L - SR[s]) / L;
        acc[a] += f * dx; acc[a + 1] += f * dy; acc[a + 2] += f * dz;
        acc[b] -= f * dx; acc[b + 1] -= f * dy; acc[b + 2] -= f * dz;
      }
      for (let j = 0; j < N; j++) acc[(j * N + N - 1) * 3] += NET.push; // free end i = N-1, pulled outwards
      for (let p = 0; p < N * N; p++) {
        const k = p * 3;
        vel[k] += acc[k] * DT + NET.noise * gauss();
        vel[k + 1] += acc[k + 1] * DT + NET.noise * gauss();
        vel[k + 2] += acc[k + 2] * DT + NET.noise * gauss();
        pos[k] += vel[k] * DT; pos[k + 1] += vel[k + 1] * DT; pos[k + 2] += vel[k + 2] * DT;
        vel[k] *= 1 - NET.damping; vel[k + 1] *= 1 - NET.damping; vel[k + 2] *= 1 - NET.damping;
      }
      // driven end i = 0 (the far end), placed kinematically
      driveT += (simTime - driveT) * NET.driveEase;
      for (let j = 0; j < N; j++) {
        const k = (j * N) * 3;
        pos[k] = rest[k];
        pos[k + 1] = NET.driveA * (Math.sin(NET.driveW1 * driveT + j * NET.drivePhase1) + NET.driveMix * Math.sin(NET.driveW2 * driveT + j * NET.drivePhase2));
        pos[k + 2] = rest[k + 2] + NET.driveB * Math.sin(NET.driveW2 * driveT + j * NET.drivePhase2 + 1.3);
        vel[k] = vel[k + 1] = vel[k + 2] = 0;
      }
    }

    // B-spline surface evaluation on a deformed net: s in [0, N-3] along, t in [0, N-3] across.
    const es = [0, 0, 0, 0], et = [0, 0, 0, 0];
    function surf(net, s, t, out) {
      const is = Math.min(Math.max(Math.floor(s), 0), N - 4), it = Math.min(Math.max(Math.floor(t), 0), N - 4);
      bsp(s - is, es); bsp(t - it, et);
      let x = 0, y = 0, z = 0;
      for (let b = 0; b < 4; b++) for (let a = 0; a < 4; a++) {
        const w = es[a] * et[b], k = ((it + b) * N + is + a) * 3;
        x += w * net[k]; y += w * net[k + 1]; z += w * net[k + 2];
      }
      out[0] = x; out[1] = y; out[2] = z; return out;
    }

    const P0 = [0, 0, 0], P1 = [0, 0, 0];
    function birth(s, t) {
      if (nFree === 0) return;
      surf(netPrev, s, t, P0); surf(netCur, s, t, P1);
      let dx = P1[0] - P0[0], dy = P1[1] - P0[1], dz = P1[2] - P0[2];
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (d < 1e-7) return;
      dx /= d; dy /= d; dz /= d;
      // spread within a cone: add a random perpendicular-ish offset
      const c = SPARK.cone;
      dx += c * gauss() * 0.5; dy += c * gauss() * 0.5; dz += c * gauss() * 0.5;
      if (rng() < SPARK.reverseP) { dx = -dx; dy = -dy; dz = -dz; }
      const f = mood.camFwd, along = dx * f[0] + dy * f[1] + dz * f[2];
      dx -= along * f[0]; dy -= along * f[1]; dz -= along * f[2];
      const n = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (n < 1e-6) return;
      const speed = Math.max(SPARK.speedMin, SPARK.speedK * Math.pow(d / DT, SPARK.speedPow)) * (0.6 + 0.8 * rng());
      const i = free[--nFree];
      alive[i] = 1;
      const k = i * 3;
      sp[k] = spPrev[k] = P1[0]; sp[k + 1] = spPrev[k + 1] = P1[1]; sp[k + 2] = spPrev[k + 2] = P1[2];
      sv[k] = dx / n * speed; sv[k + 1] = dy / n * speed; sv[k + 2] = dz / n * speed;
      sAge[i] = 0;
      sRate[i] = Math.max(SPARK.rateMin, SPARK.rateMean * (1 + SPARK.rateSpread * gauss()));
      // random initial orientation
      let qx = gauss(), qy = gauss(), qz = gauss(), qw = gauss();
      const qn = Math.sqrt(qx * qx + qy * qy + qz * qz + qw * qw) || 1;
      sq[i * 4] = qx / qn; sq[i * 4 + 1] = qy / qn; sq[i * 4 + 2] = qz / qn; sq[i * 4 + 3] = qw / qn;
      for (let a = 0; a < 3; a++) {
        sSpin[i * 6 + a] = SPARK.spinF[0] + (SPARK.spinF[1] - SPARK.spinF[0]) * rng();
        sSpin[i * 6 + 3 + a] = rng() * 6.2832;
      }
      sRnd[i] = rng();
    }
    function randPoint() { return [rng() * (N - 3), rng() * (N - 3)]; }

    function emit() {
      if (rng() < SPARK.burstP) {
        const n = SPARK.burstMin + Math.floor(rng() * (SPARK.burstMax - SPARK.burstMin + 1));
        for (let b = 0; b < n; b++) { const p = randPoint(); birth(p[0], p[1]); }
      }
      for (const w of walkers) {
        if (!w.on) {
          if (rng() < SPARK.walkerP) {
            const p = randPoint(); w.on = true; w.s = p[0]; w.t = p[1];
            w.dir = rng() < 0.5 ? -1 : 1; w.left = SPARK.walkMin + Math.floor(rng() * (SPARK.walkMax - SPARK.walkMin));
          }
          continue;
        }
        birth(w.s, w.t);
        w.s += w.dir * SPARK.walkStep;
        if (--w.left <= 0 || w.s < 0 || w.s > N - 3) w.on = false;
      }
    }

    function stepSparks() {
      const fr = SPARK.friction, g = SPARK.gravity, jit = SPARK.jitter, box = SPARK.box;
      for (let i = 0; i < S; i++) {
        if (!alive[i]) continue;
        const k = i * 3;
        spPrev[k] = sp[k]; spPrev[k + 1] = sp[k + 1]; spPrev[k + 2] = sp[k + 2];
        const ax = jit * gauss() - fr * sv[k], ay = jit * gauss() - g - fr * sv[k + 1], az = jit * gauss() - fr * sv[k + 2];
        sv[k] += ax * DT; sv[k + 1] += ay * DT; sv[k + 2] += az * DT;
        sp[k] += sv[k] * DT; sp[k + 1] += sv[k + 1] * DT; sp[k + 2] += sv[k + 2] * DT;
        sAge[i] += sRate[i] * DT;
        // spin: angular velocity oscillating slowly with age
        const age = sAge[i] / sRate[i];
        const wx = SPARK.spinA * Math.sin(sSpin[i * 6] * age + sSpin[i * 6 + 3]);
        const wy = SPARK.spinA * Math.sin(sSpin[i * 6 + 1] * age + sSpin[i * 6 + 4]);
        const wz = SPARK.spinA * Math.sin(sSpin[i * 6 + 2] * age + sSpin[i * 6 + 5]);
        const q = i * 4, x = sq[q], y = sq[q + 1], z = sq[q + 2], w = sq[q + 3], h = 0.5 * DT;
        let nx = x + h * (wx * w + wy * z - wz * y), ny = y + h * (wy * w + wz * x - wx * z);
        let nz = z + h * (wz * w + wx * y - wy * x), nw = w - h * (wx * x + wy * y + wz * z);
        const n = Math.sqrt(nx * nx + ny * ny + nz * nz + nw * nw);
        sq[q] = nx / n; sq[q + 1] = ny / n; sq[q + 2] = nz / n; sq[q + 3] = nw / n;
        if (sAge[i] >= 1 || sp[k] < box[0][0] || sp[k] > box[0][1] || sp[k + 1] < box[1][0] ||
            sp[k + 1] > box[1][1] || sp[k + 2] < box[2][0] || sp[k + 2] > box[2][1]) {
          alive[i] = 0; free[nFree++] = i;
        }
      }
    }

    function step() {
      simTime += DT; steps++;
      latticeTargets();
      stepNet();
      const t = netPrev; netPrev = netCur; netCur = t;
      deform(netCur);
      stepSparks();
      emit();
    }

    // Pack the alive sparkles for drawing.
    function packSparks(out) {
      let n = 0;
      for (let i = 0; i < S; i++) {
        if (!alive[i]) continue;
        const k = i * 3, o = n * SPARK_STRIDE, a = sAge[i];
        out[o] = spPrev[k]; out[o + 1] = spPrev[k + 1]; out[o + 2] = spPrev[k + 2];
        out[o + 3] = sp[k]; out[o + 4] = sp[k + 1]; out[o + 5] = sp[k + 2];
        // facing = q * (0, 0, 1)
        const q = i * 4, x = sq[q], y = sq[q + 1], z = sq[q + 2], w = sq[q + 3];
        out[o + 6] = 2 * (x * z + w * y); out[o + 7] = 2 * (y * z - w * x); out[o + 8] = 1 - 2 * (x * x + y * y);
        const op = Math.min(1, a / SPARK.rampIn) * Math.min(1, (1 - a) / SPARK.rampOut);
        out[o + 9] = op * op * (3 - 2 * op);
        out[o + 10] = sRnd[i];
        n++;

function buildGlare(m, bgT, bgOn, waveOn, peak) {

  pr = PR.down; gl.useProgram(pr.p); gl.uniform1i(pr.u.uT, 0);

    gl.bindTexture(gl.TEXTURE_2D, lv[i - 1].a.tex); gl.uniform2f(pr.u.uTexel, 0.5 / lv[i - 1].w, 0.5 / lv[i - 1].h);

  const s = m.glareSigma; gl.uniform3f(pr.u.uSigma, s * 1.08, s, s * 0.93);
  for (const l of lv) {
    gl.viewport(0, 0, l.w, l.h);
    bindTarget(l.b); gl.bindTexture(gl.TEXTURE_2D, l.a.tex); gl.uniform2f(pr.u.uDir, 1 / l.w, 0); quad();
    bindTarget(l.c); gl.bindTexture(gl.TEXTURE_2D, l.b.tex); gl.uniform2f(pr.u.uDir, 0, 1 / l.h); quad();

    bindTarget(lv[i].b); gl.viewport(0, 0, lv[i].w, lv[i].h);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, lv[i].c.tex);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, acc.tex);
    gl.uniform1f(pr.u.uRatio, m.glareRatio); quad();
    acc = lv[i].b; wk *= m.glareRatio; wsum += wk;

  gl.activeTexture(gl.TEXTURE0);

}

// ---------------------------------------------------------------------------
// Deterministic score mode
// ---------------------------------------------------------------------------
function parseLayers(s) {

}
const urlOpts = { time: params.get('time'), theme: params.get('theme'), seed: params.get('seed'), frames: params.get('frames'),

    seed: parseInt(g('seed') ?? 1, 10) || 0,
    frames: Math.max(0, parseInt(g('frames') ?? 0, 10) || 0),
    w: Math.max(1, parseInt(g('w') ?? 1920, 10) || 1920),

  const o = resolveOpts(opts);

  const key = [o.seed, o.theme, o.timeParts.join(','), o.w / o.h].join('|');
  if (!scoreSim || scoreSim.key !== key || scoreSim.frames > o.frames) {
    const sim = SIMM.createSim(o.seed);
    sim.setMood(simMoodParams(scene.mood, cam));

  }
  while (scoreSim.frames < o.frames) { scoreSim.sim.step(); scoreSim.frames++; }

  const n = sim.packSparks(sparkPack);

    layers: o.layers, frameNo: o.frames, ease: 1 }, RT.out);

  for (let i = 3; i < data.length; i += 4) data[i] = 255;

}

window.XMBW = { ready: Promise.resolve(), render, _internals: { PALETTES, MOODS, WAVE, SPARKR, CAMERA, SIMM, moodAt, nightWeight, sceneParams } };
if (SCORE) { canvas.style.display = 'none'; return; }

// ---------------------------------------------------------------------------
// Normal mode: settings, panel, worker, draw loop
// ---------------------------------------------------------------------------
const STORE_KEY = 'xmb-waves-settings-v1';
const DEFAULTS = { theme: 0, useFixed: false, fixedTime: '', speed: 1, scale: 0, fps: false,
  layers: { bg: true, wave: true, glare: true, sparkles: true, dither: true } };
function loadSettings() {
  let s = {};
  try { s = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) { s = {}; }
  const o = { ...DEFAULTS, ...s, layers: { ...DEFAULTS.layers, ...(s.layers || {}) } };
  // URL parameters override stored settings
  if (params.has('theme')) o.theme = Math.max(0, Math.min(12, parseInt(params.get('theme'), 10) || 0));
  if (params.has('time')) { o.useFixed = true; o.fixedTime = params.get('time'); }
  if (params.has('speed')) o.speed = parseFloat(params.get('speed')) || 1;
  if (params.has('scale')) o.scale = parseFloat(params.get('scale')) || 0;
  if (params.has('fps')) o.fps = params.get('fps') === '1';
  if (params.has('layers')) o.layers = parseLayers(params.get('layers'));

}
function saveSettings() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } }
const S = loadSettings();
let paused = params.get('pause') === '1';

// day clock: virtual time = anchor + (now - anchorReal) * speed
let clockAnchor = null, clockReal = 0;
function resetClock() {
  const fixed = S.useFixed ? parseTime(S.fixedTime) : null;
  clockAnchor = fixed ? new Date(fixed[0], fixed[1] - 1, fixed[2], fixed[3], fixed[4], Math.floor(fixed[5])).getTime() : Date.now();
  clockReal = performance.now();
}
let clockFrozenAt = null;
function clockNow(now) {
  if (paused) { if (clockFrozenAt == null) clockFrozenAt = clockAnchor + (now - clockReal) * S.speed; return clockFrozenAt; }
  if (clockFrozenAt != null) { clockAnchor = clockFrozenAt; clockReal = now; clockFrozenAt = null; }
  return clockAnchor + (now - clockReal) * S.speed;
}
resetClock();

// panel
const $ = id => document.getElementById(id);
const panel = $('panel'), fpsEl = $('fps');
['auto (clock)', 'silver', 'yellow', 'light green', 'pink', 'green', 'lavender', 'teal', 'blue', 'purple', 'gold', 'brown', 'red']
  .forEach((n, i) => { const op = document.createElement('option'); op.value = i; op.textContent = i + ' ' + n; $('pTheme').appendChild(op); });
function syncPanel() {
  $('pTheme').value = S.theme; $('pFixed').checked = S.useFixed; $('pTime').value = S.fixedTime || '';
  $('pSpeed').value = String(S.speed);
  $('pScale').value = S.scale; $('pScaleV').textContent = S.scale ? S.scale + 'x' : 'auto';
  $('pFps').checked = S.fps; $('pPause').textContent = paused ? 'play' : 'pause'; $('pStep').disabled = !paused;
  for (const k of Object.keys(S.layers)) $('pL_' + k).checked = S.layers[k];
  fpsEl.style.display = S.fps ? 'block' : 'none';
}
$('pTheme').onchange = e => { S.theme = +e.target.value; saveSettings(); };
$('pFixed').onchange = e => { S.useFixed = e.target.checked; if (S.useFixed && !S.fixedTime) S.fixedTime = toLocalInput(new Date()); syncPanel(); resetClock(); saveSettings(); };
$('pTime').onchange = e => { S.fixedTime = e.target.value; resetClock(); saveSettings(); };
$('pSpeed').onchange = e => { const now = performance.now(); clockAnchor = clockNow(now); clockReal = now; S.speed = +e.target.value; syncPanel(); saveSettings(); };
$('pScale').oninput = e => { S.scale = +e.target.value; syncPanel(); saveSettings(); };
$('pFps').onchange = e => { S.fps = e.target.checked; syncPanel(); saveSettings(); };
$('pPause').onclick = () => { paused = !paused; worker.postMessage({ type: 'run', on: !paused && !document.hidden }); syncPanel(); };
$('pStep').onclick = () => { if (paused) worker.postMessage({ type: 'step' }); };
for (const k of Object.keys(DEFAULTS.layers)) $('pL_' + k).onchange = e => { S.layers[k] = e.target.checked; saveSettings(); };
$('gear').onclick = () => { panel.classList.toggle('open'); };
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'p' || e.key === 'h') panel.classList.toggle('open');
  if (e.key === ' ') $('pPause').onclick();
  if (e.key === '.' ) $('pStep').onclick();
});
function toLocalInput(d) { const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
let gearTimer = 0;
function pokeGear() { document.body.classList.add('active'); clearTimeout(gearTimer); gearTimer = setTimeout(() => document.body.classList.remove('active'), 2500); }
window.addEventListener('pointermove', pokeGear); window.addEventListener('pointerdown', pokeGear);
syncPanel();

// worker
function workerMain(SIMF) {
  const M = SIMF(); let sim = null, running = false, last = 0, acc = 0; const spare = [];
  const absNow = () => performance.timeOrigin + performance.now();
  function send(alpha) {
    const need = M.N * M.N * 6 + 4096 * M.SPARK_STRIDE;
    let buf = spare.pop(); if (!buf || buf.byteLength < need * 4) buf = new ArrayBuffer(need * 4);
    const f = new Float32Array(buf);
    f.set(sim.netPrev, 0); f.set(sim.netCur, M.N * M.N * 3);
    const n = sim.packSparks(f.subarray(M.N * M.N * 6));
    postMessage({ buf, n, alpha, at: absNow() }, [buf]);
  }
  function loop() {
    if (!running) return;

    let n = 0;
    while (acc >= M.DT && n < 8) { sim.step(); acc -= M.DT; n++; }
    if (n) send(acc / M.DT);
    setTimeout(loop, Math.max(1, Math.floor((M.DT - acc) * 1000))); // sleep until the next step is due
  }

    const d = e.data;
    if (d.type === 'init') { sim = M.createSim(d.seed); sim.setMood(d.mood); sim.warm(sim.warmSteps); send(1); }
    else if (d.type === 'mood') { if (sim) sim.setMood(d.mood); }
    else if (d.type === 'run') { const was = running; running = d.on; if (running && !was) { last = performance.now(); acc = 0; loop(); } }
    else if (d.type === 'step') { if (sim) { sim.step(); send(1); } }

}
const workerSrc = `${XMBW_SIM.toString()}\n(${workerMain.toString()})(XMBW_SIM);`;
const worker = new Worker(URL.createObjectURL(new Blob([workerSrc], { type: 'text/javascript' })));
let latest = null;
const NET3 = NN * NN * 3;
worker.onmessage = e => {
  if (latest) worker.postMessage({ type: 'return', buf: latest.buf }, [latest.buf]);
  const d = e.data, f = new Float32Array(d.buf);
  latest = { buf: d.buf, net0: f.subarray(0, NET3), net1: f.subarray(NET3, NET3 * 2), sparks: f.subarray(NET3 * 2), n: d.n, alpha: d.alpha, at: d.at };
};
const seed = params.has('seed') ? (parseInt(params.get('seed'), 10) || 0) : (Date.now() & 0x7fffffff);
let lastMoodSent = '';
function currentScene(now) {
  const tp = partsOf(new Date(clockNow(now)));
  const scene = sceneParams(tp, S.theme);
  return scene;
}
{
  const sc0 = currentScene(performance.now());
  worker.postMessage({ type: 'init', seed, mood: simMoodParams(sc0.mood, cameraFor(sc0.mood.camPitch, 16 / 9)) });
  worker.postMessage({ type: 'run', on: !paused });
}

// screen wake lock
let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && !document.hidden && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) { wakeLock = null; }
}
keepAwake();
window.addEventListener('pointerdown', keepAwake);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { worker.postMessage({ type: 'run', on: false }); }
  else { worker.postMessage({ type: 'run', on: !paused }); keepAwake(); lastDraw = 0; schedule(); }
});

// a lost WebGL context (memory pressure on a tablet): stop drawing, reload when it comes back
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); worker.postMessage({ type: 'run', on: false }); }, false);
canvas.addEventListener('webglcontextrestored', () => { location.reload(); }, false);

// draw loop (capped at 60 fps)

function tick(now) {

  const ow = Math.max(1, Math.round(cssW * dpr)), oh = Math.max(1, Math.round(cssH * dpr));
  const scale = S.scale > 0 ? S.scale : dpr;              // render pixels per CSS pixel

  const cam = cameraFor(scene.mood.camPitch, cw / ch);
  const ms = JSON.stringify(simMoodParams(scene.mood, cam), (k, v) => typeof v === 'number' ? +v.toFixed(3) : v);
  if (ms !== lastMoodSent) { worker.postMessage({ type: 'mood', mood: JSON.parse(ms) }); lastMoodSent = ms; }

    renderFrame({ scene, cam, net0: null, net1: null, alpha: 1, sparks: null, nSparks: 0,
      layers: { ...S.layers, wave: false, glare: false, sparkles: false }, frameNo: frameNo++, ease: 0.05 }, null);
    return;
  }

  if (!firstState) firstState = now;

  if (fadeIn < 1) { scene.mood = { ...scene.mood, waveBright: scene.mood.waveBright * fadeIn, sparkBright: scene.mood.sparkBright * fadeIn, glareStrength: scene.mood.glareStrength * fadeIn }; }
  renderFrame({ scene, cam, net0: latest.net0, net1: latest.net1, alpha, sparks: latest.sparks, nSparks: latest.n,
    layers: S.layers, frameNo: frameNo++, ease: 0.05 }, null);
  fpsCount++;
  if (now - fpsT > 500) { fpsEl.textContent = (fpsCount * 1000 / (now - fpsT)).toFixed(0) + ' fps · ' + cw + 'x' + ch; fpsCount = 0; fpsT = now; }
}
schedule();
})();
