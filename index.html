<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>xmb-waves</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #panel { position: fixed; left: 8px; bottom: 8px; font: 12px/1.4 system-ui, sans-serif;
    color: #fff; background: rgba(0,0,0,.45); padding: 6px 8px; border-radius: 6px; display: none; }
  #panel label { display: block; }
  #panel input, #panel select { font: inherit; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <label>theme <select id="pTheme"></select></label>
  <label>time speed <input id="pSpeed" type="range" min="0" max="3" step="0.05" value="1"></label>
  <label>render scale <input id="pScale" type="range" min="0.25" max="2" step="0.05" value="1"></label>
  <label><input id="pPause" type="checkbox"> pause</label>
  <div id="pInfo"></div>
</div>
<script>
'use strict';
(function () {

// ---------------------------------------------------------------------------
// Parameters (all values are original design choices, tuned against scores)
// ---------------------------------------------------------------------------

// Background palettes: [top rgb, mid rgb, bottom rgb, midY, tiltX]
// Colours are display (sRGB-encoded) values in 0..1.
const MONTHS = [
  /* 1 */ [[0.55, 0.57, 0.60], [0.68, 0.70, 0.73], [0.82, 0.83, 0.85], 0.5, 0.10],
  /* 2 */ [[0.62, 0.55, 0.10], [0.74, 0.68, 0.22], [0.85, 0.80, 0.35], 0.5, 0.10],
  /* 3 */ [[0.45, 0.62, 0.20], [0.58, 0.74, 0.32], [0.72, 0.85, 0.45], 0.5, 0.10],
  /* 4 */ [[0.75, 0.35, 0.55], [0.84, 0.50, 0.66], [0.92, 0.65, 0.78], 0.5, 0.10],
  /* 5 */ [[0.10, 0.45, 0.12], [0.22, 0.56, 0.21], [0.35, 0.68, 0.30], 0.5, 0.10],
  /* 6 */ [[0.50, 0.40, 0.72], [0.62, 0.54, 0.80], [0.75, 0.68, 0.88], 0.5, 0.10],
  /* 7 */ [[0.05, 0.45, 0.48], [0.17, 0.57, 0.59], [0.30, 0.70, 0.70], 0.5, 0.10],
  /* 8 */ [[0.08, 0.25, 0.62], [0.21, 0.40, 0.73], [0.35, 0.55, 0.85], 0.5, 0.10],
  /* 9 */ [[0.38, 0.12, 0.55], [0.49, 0.25, 0.65], [0.60, 0.38, 0.75], 0.5, 0.10],
  /*10 */ [[0.62, 0.45, 0.10], [0.74, 0.58, 0.22], [0.85, 0.70, 0.35], 0.5, 0.10],
  /*11 */ [[0.40, 0.25, 0.12], [0.52, 0.36, 0.21], [0.65, 0.48, 0.30], 0.5, 0.10],
  /*12 */ [[0.60, 0.08, 0.08], [0.72, 0.21, 0.19], [0.85, 0.35, 0.30], 0.5, 0.10],
];
const THEMES = MONTHS.map(p => JSON.parse(JSON.stringify(p)));

// Moods: night, dawn, day, dusk. Centre hour, and per-mood factors.
const MOOD_CENTRE = [0, 6, 12, 18];
const MOOD_HOLD = 1.5, MOOD_RAMP = 3.0; // hours
// [bgBright, bgSat, waveBright, glare, sparkleBright]
const MOOD = [
  [0.45, 0.60, 0.55, 0.40, 0.60],
  [0.80, 0.90, 0.85, 0.80, 0.85],
  [1.00, 1.00, 1.00, 1.00, 1.00],
  [0.75, 0.90, 0.85, 0.80, 0.85],
];
const THEME_MOOD = [0, 0, 1, 0]; // fixed themes look like daytime

// Camera. World: x along the ribbon, y up, z away from the viewer.
const CAMERA = {
  fovY: 40,        // degrees
  pitch: 15,       // degrees, looking down
  yaw: 10,         // degrees, oblique view along the ribbon
  dist: 3.3,       // from the target point
  target: [0, 0.12, 0],
};

// Wave surface S(x, v): a ribbon whose spine runs along x, with a cross direction
// that is twisted about the spine by an angle phi(x, t); v in [0, 1] is across.
// Each component: [amplitude, spatial frequency, temporal frequency (rad/s),
//                  amplitude-modulation depth, modulation frequency (rad/s)]
const WAVE = {
  speed: 1.4,              // global time scale of the wave's motion
  x0: -3.4, x1: 3.4,       // world units
  c0: 0.40,                // spine height
  C: [[0.300, 0.85, 0.090, 0.35, 0.031], [0.110, 1.40, -0.140, 0.40, 0.047],
      [0.035, 1.55, 0.200, 0.45, 0.059], [0.012, 2.40, -0.270, 0.50, 0.073]],
  Z: [[0.300, 0.40, 0.080, 0.35, 0.029], [0.150, 0.85, -0.120, 0.40, 0.043]],
  w0: 1.4,                 // ribbon width (world)
  W: [[0.25, 0.40, 0.070, 0.30, 0.023], [0.15, 0.85, -0.130, 0.40, 0.041],
      [0.06, 1.40, 0.190, 0.40, 0.053]],
  p0: 0.0,                 // twist about the spine (rad); 0 = lying flat
  P: [[0.30, 0.60, 0.090, 0.30, 0.027], [0.18, 1.15, -0.150, 0.40, 0.039],
      [0.12, 0.30, 0.050, 0.30, 0.017]],
  // Displacement along the surface normal. With a large phase per unit v these
  // are lengthwise folds across the ribbon that drift along it and merge.
  // [amp, freq, omega, modDepth, modFreq, phase per unit v]
  R: [[0.090, 0.70, 0.35, 0.45, 0.037, 9.5], [0.055, 1.30, -0.50, 0.50, 0.051, 14.0],
      [0.030, 2.10, 0.70, 0.50, 0.067, 21.0], [0.010, 3.40, -0.95, 0.40, 0.083, 4.0]],
  fade: 0.8,          // world length of the end fades
  // each thread also wanders on its own: [amp, freq, omega]
  thread: [0.004, 2.3, 0.35],
  lines: 280,
  segs: 320,
  lineWidth: 2.6,     // px at 1080 lines, at the camera distance
  lineBright: 0.019,  // per-line peak
  edgeBoost: 1.5,     // extra brightness when seen edge-on (from the 3D normal)
  edgePow: 2.0,
  tint: 0.12,         // how much the palette tints the wave
};

const SPARK = {
  slots: 420,
  periodMin: 5, periodMax: 12,  // s
  lifeMin: 0.55, lifeMax: 0.95, // fraction of period
  fadeIn: 0.8, fadeOut: 1.6,    // s
  follow: 1.5,                  // s: time constant of following the wave after birth
  nearSigma: 0.08, farSigma: 0.45, farFrac: 0.3, // world units, 3D offsets from the sheet
  drift: 0.04,                  // world units per second
  wobble: 0.03,
  span: 2.6,                    // births along x within +-span
  sharpR: [1.0, 2.4],           // px at 1080
  bokehR: [3.5, 9.0],
  bokehFrac: 0.25,
  sharpI: [0.35, 1.0],
  bokehI: [0.08, 0.22],
  twinkleFrac: 0.3,
  glint: 0.25,
};

// Two halos: a tight one around bright lines and a wide, faint one. Sigmas are in screen heights.
const GLARE = { sigma: 0.035, threshold: 0.15, strength: 0.6, nearSigma: 0.006, nearStrength: 0.5 };
const DITHER = 1.0; // in 1/255 units, peak-to-peak/2

// ---------------------------------------------------------------------------
// Seeded randomness
// ---------------------------------------------------------------------------
function hash32(a) {
  a |= 0; a = (a ^ 61) ^ (a >>> 16); a = Math.imul(a, 9); a ^= a >>> 4;
  a = Math.imul(a, 0x27d4eb2d); a ^= a >>> 15; return a >>> 0;
}
function hashN(...xs) { let h = 0x9e3779b9; for (const x of xs) h = hash32(h ^ hash32(x | 0)); return h; }
function rnd(...xs) { return hashN(...xs) / 4294967296; }
function mulberry(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0; let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------------------------------------------------------------------------
// Wave evaluation (the same formula is used in the vertex shader)
// ---------------------------------------------------------------------------
const TAU = Math.PI * 2;
function makeWaveState(seed) {
  const r = mulberry(hashN(seed, 7771));
  const ph = g => g.map(() => [r() * TAU, r() * TAU]);
  return { tOff: r() * 5000, C: ph(WAVE.C), Z: ph(WAVE.Z), W: ph(WAVE.W), P: ph(WAVE.P), R: ph(WAVE.R) };
}
// Per-component [amp, freq, phase(, vmul)] at time t (double precision phases).
function waveUniforms(ws, t) {
  t = t * WAVE.speed + ws.tOff;
  const f = (comps, phs, n) => comps.map((c, k) => {
    const a = c[0] * (1 + c[3] * Math.sin(c[4] * t + phs[k][1]));
    const p = ((c[2] * t + phs[k][0]) % TAU + TAU) % TAU;
    return [a, c[1], p, n ? c[5] : 0];
  });
  return { C: f(WAVE.C, ws.C), Z: f(WAVE.Z, ws.Z), W: f(WAVE.W, ws.W), P: f(WAVE.P, ws.P),
           R: f(WAVE.R, ws.R, 1) };
}
// World position of the sheet at (x, v).
function sheetPos(u, x, v) {
  let c = WAVE.c0, z = 0, w = 1, p = WAVE.p0, rr = 0;
  for (const k of u.C) c += k[0] * Math.sin(k[1] * x + k[2]);
  for (const k of u.Z) z += k[0] * Math.sin(k[1] * x + k[2]);
  for (const k of u.W) w += k[0] * Math.sin(k[1] * x + k[2]);
  for (const k of u.P) p += k[0] * Math.sin(k[1] * x + k[2]);
  for (const k of u.R) rr += k[0] * Math.sin(k[1] * x + k[2] + k[3] * v);
  const s = (v - 0.5) * WAVE.w0 * w, sp = Math.sin(p), cp = Math.cos(p);
  // cross direction (0, sin p, cos p); normal (0, cos p, -sin p)
  return [x, c + s * sp + rr * cp, z + s * cp - rr * sp];
}
// Same as sheetPos(waveUniforms(ws, t), x, v), without allocating; writes into out.
function sheetPosAt(ws, t, x, v, out) {
  t = t * WAVE.speed + ws.tOff;
  const sum = (comps, phs, vv) => {
    let acc = 0;
    for (let k = 0; k < comps.length; k++) {
      const c = comps[k], ph = phs[k];
      const a = c[0] * (1 + c[3] * Math.sin(c[4] * t + ph[1]));
      acc += a * Math.sin(c[1] * x + ((c[2] * t + ph[0]) % TAU) + (vv ? c[5] * v : 0));
    }
    return acc;
  };
  const c = WAVE.c0 + sum(WAVE.C, ws.C), z = sum(WAVE.Z, ws.Z), w = 1 + sum(WAVE.W, ws.W);
  const p = WAVE.p0 + sum(WAVE.P, ws.P), rr = sum(WAVE.R, ws.R, true);
  const sw = (v - 0.5) * WAVE.w0 * w, sp = Math.sin(p), cp = Math.cos(p);
  out[0] = x; out[1] = c + sw * sp + rr * cp; out[2] = z + sw * cp - rr * sp;
  return out;
}
// Camera basis and projection to screen-height units (origin at centre, Y up).
const CAM = (() => {
  const d2r = Math.PI / 180, p = CAMERA.pitch * d2r, y = CAMERA.yaw * d2r;
  const fwd = [Math.sin(y) * Math.cos(p), -Math.sin(p), Math.cos(y) * Math.cos(p)];
  const right = [Math.cos(y), 0, -Math.sin(y)];
  const up = [fwd[1] * right[2] - fwd[2] * right[1], fwd[2] * right[0] - fwd[0] * right[2],
              fwd[0] * right[1] - fwd[1] * right[0]];
  const pos = CAMERA.target.map((t, i) => t - CAMERA.dist * fwd[i]);
  return { fwd, right, up, pos, F: 0.5 / Math.tan(CAMERA.fovY * d2r / 2) };
})();
// Returns [X, Y, depth] or null if behind the camera.
function project(q) {
  const d = [q[0] - CAM.pos[0], q[1] - CAM.pos[1], q[2] - CAM.pos[2]];
  const zc = d[0] * CAM.fwd[0] + d[1] * CAM.fwd[1] + d[2] * CAM.fwd[2];
  if (zc < 0.2) return null;
  const xc = d[0] * CAM.right[0] + d[1] * CAM.right[1] + d[2] * CAM.right[2];
  const yc = d[0] * CAM.up[0] + d[1] * CAM.up[1] + d[2] * CAM.up[2];
  return [CAM.F * xc / zc, CAM.F * yc / zc, zc];
}

// ---------------------------------------------------------------------------
// Time of day / palette
// ---------------------------------------------------------------------------
function moodWeights(hour) {
  const w = MOOD_CENTRE.map(c => {
    let d = Math.abs(hour - c) % 24; if (d > 12) d = 24 - d;
    const s = Math.min(Math.max((d - MOOD_HOLD) / MOOD_RAMP, 0), 1);
    return 1 - s * s * (3 - 2 * s);
  });
  const sum = w.reduce((a, b) => a + b, 0);
  return w.map(x => x / sum);
}
function flat(p) { return [...p[0], ...p[1], ...p[2], p[3], p[4]]; }
function lerpArr(a, b, t) { return a.map((x, i) => x + (b[i] - x) * t); }
function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
// Palette (flat array) for a date; blends into neighbours only near month boundaries.
function monthPalette(y, mon, day, hour) {
  const dim = daysInMonth(y, mon);
  const pos = day - 1 + hour / 24; // days since start of month
  const W = 3; // half-width of the blend window, days
  let a = mon, b = mon, t = 0;
  if (pos < W) { b = mon === 1 ? 12 : mon - 1; t = 0.5 * (1 - pos / W); }
  else if (pos > dim - W) { b = mon === 12 ? 1 : mon + 1; t = 0.5 * (1 - (dim - pos) / W); }
  t = t * t * (3 - 2 * t) ;
  return lerpArr(flat(MONTHS[a - 1]), flat(MONTHS[b - 1]), t);
}
function sceneParams(timeParts, theme) {
  const [y, mon, day, hh, mm, ss] = timeParts;
  const hour = hh + mm / 60 + ss / 3600;
  let pal, mw;
  if (theme >= 1 && theme <= 12) { pal = flat(THEMES[theme - 1]); mw = THEME_MOOD; }
  else { pal = monthPalette(y, mon, day, hour); mw = moodWeights(hour); }
  const m = [0, 0, 0, 0, 0];
  for (let i = 0; i < 4; i++) for (let j = 0; j < 5; j++) m[j] += mw[i] * MOOD[i][j];
  return { pal, bgBright: m[0], bgSat: m[1], waveBright: m[2], glare: m[3], sparkBright: m[4] };
}
function parseTime(s) {
  const m = /^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ](\d{1,2})(?::(\d{1,2})(?::(\d{1,2}(?:\.\d+)?))?)?)?/.exec(s || '');
  if (!m) return null;
  return [+m[1], +m[2], +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0)];
}
function nowParts() {
  const d = new Date();
  return [d.getFullYear(), d.getMonth() + 1, d.getDate(), d.getHours(), d.getMinutes(),
          d.getSeconds() + d.getMilliseconds() / 1000];
}

// ---------------------------------------------------------------------------
// Sparkles (analytic in time: each slot runs a seeded sequence of lives)
// ---------------------------------------------------------------------------
const SPARK_STRIDE = 9; // X, Y (screen-height units), radius (px@1080), intensity, r, g, b, softness, glint
function makeSparkSlots(seed) {
  const slots = [];
  for (let i = 0; i < SPARK.slots; i++) {
    const r = mulberry(hashN(seed, 911, i));
    const period = SPARK.periodMin + (SPARK.periodMax - SPARK.periodMin) * r();
    slots.push({ period, offset: r() * period * 50 });
  }
  return slots;
}
const SP_TMP = [0, 0, 0];
function gauss(r) { return Math.sqrt(-2 * Math.log(1 - r())) * Math.cos(TAU * r()); }
function sparkles(seed, slots, ws, t, out) {
  let n = 0;
  for (let i = 0; i < slots.length; i++) {
    const s = slots[i];
    const T = t + s.offset;
    const cyc = Math.floor(T / s.period);
    const age = T - cyc * s.period;
    const r = mulberry(hashN(seed, 313, i, cyc));
    const life = s.period * (SPARK.lifeMin + (SPARK.lifeMax - SPARK.lifeMin) * r());
    if (age > life) continue;
    const x0 = (r() * 2 - 1) * SPARK.span;
    const v0 = r();
    const far = r() < SPARK.farFrac;
    const sg = far ? SPARK.farSigma : SPARK.nearSigma;
    const off = [gauss(r) * sg * 0.5, gauss(r) * sg, gauss(r) * sg];
    const sp = SPARK.drift * (0.3 + r());
    const dv = [gauss(r) * sp, gauss(r) * sp * 0.6, gauss(r) * sp * 0.6];
    const wf = 0.5 + r() * 1.5, wp = r() * TAU, wa = SPARK.wobble * r();
    const bokeh = r() < SPARK.bokehFrac;
    const rad = bokeh ? SPARK.bokehR[0] + (SPARK.bokehR[1] - SPARK.bokehR[0]) * r()
                      : SPARK.sharpR[0] + (SPARK.sharpR[1] - SPARK.sharpR[0]) * r();
    let inten = bokeh ? SPARK.bokehI[0] + (SPARK.bokehI[1] - SPARK.bokehI[0]) * r()
                      : SPARK.sharpI[0] + (SPARK.sharpI[1] - SPARK.sharpI[0]) * r();
    const tw = r() < SPARK.twinkleFrac, twf = 3 + r() * 6, twp = r() * TAU;
    const hp = r() * TAU, hf = 0.5 + r();
    // Follow the sheet point for a while after birth, then let go (time warp).
    const tb = t - age;
    const tf = SPARK.follow * (0.5 + r());
    const S = sheetPosAt(ws, tb + tf * (1 - Math.exp(-age / tf)), x0, v0, SP_TMP);
    const wob = Math.sin(wf * age + wp) - Math.sin(wp), wob2 = Math.cos(wf * 1.3 * age + wp) - Math.cos(wp);
    S[0] += off[0] + dv[0] * age + wa * wob;
    S[1] += off[1] + dv[1] * age + wa * wob2;
    S[2] += off[2] + dv[2] * age + wa * 0.5 * wob;
    const q = project(S);
    if (!q) continue;
    const fade = Math.min(1, age / SPARK.fadeIn) * Math.min(1, (life - age) / SPARK.fadeOut);
    const f2 = fade * fade * (3 - 2 * fade);
    if (tw) inten *= 0.55 + 0.45 * Math.sin(twf * T + twp);
    inten *= f2;
    if (inten <= 0.001) continue;
    const hh = hf * T + hp;
    const o = n * SPARK_STRIDE;
    out[o] = q[0]; out[o + 1] = q[1]; out[o + 2] = rad * CAMERA.dist / q[2]; out[o + 3] = inten;
    out[o + 4] = 1 + 0.10 * Math.sin(hh); out[o + 5] = 1 + 0.10 * Math.sin(hh + 2.1);
    out[o + 6] = 1 + 0.10 * Math.sin(hh + 4.2);
    out[o + 7] = bokeh ? 1 : 0; out[o + 8] = bokeh ? 0.3 * SPARK.glint : SPARK.glint;
    n++;
  }
  return n;
}

// ---------------------------------------------------------------------------
// WebGL
// ---------------------------------------------------------------------------
const params = new URLSearchParams(location.search);
const SCORE = params.get('mode') === 'score';
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false,
  stencil: false, premultipliedAlpha: false, preserveDrawingBuffer: SCORE,
  powerPreference: 'high-performance' });
if (!gl) { document.body.textContent = 'WebGL2 is not available.'; return; }
const hasFloatRT = !!gl.getExtension('EXT_color_buffer_float') ||
                   !!gl.getExtension('EXT_color_buffer_half_float');

const VS_QUAD = `#version 300 es
out vec2 vUv;
void main(){ vec2 p = vec2((gl_VertexID & 1) * 2, (gl_VertexID >> 1) * 2);
  vUv = p; gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;

const NC = WAVE.C.length, NZ = WAVE.Z.length, NW = WAVE.W.length, NP = WAVE.P.length, NR = WAVE.R.length;
const VS_WAVE = `#version 300 es
precision highp float;
uniform vec4 uC[${NC}]; uniform vec4 uZ[${NZ}]; uniform vec4 uW[${NW}]; uniform vec4 uP[${NP}]; uniform vec4 uR[${NR}];
uniform float uC0, uW0, uP0, uX0, uX1, uFade, uLineW, uLineI, uEdge, uEdgePow, uCamDist;
uniform vec3 uThread; uniform float uThreadT;
uniform vec3 uCamPos, uCamR, uCamU, uCamF; uniform float uFocal;
uniform vec2 uRes; uniform int uSegs, uLines;
out float vD; out float vI; out float vHalf;
float hash(float n){ return fract(sin(n * 12.9898) * 43758.5453); }
float gThrPh;
vec3 sheet(float x, float v){
  float c = uC0, z = 0.0, w = 1.0, p = uP0;
  float r = uThread.x * sin(uThread.y * x + uThreadT + gThrPh);
  for (int k = 0; k < ${NC}; k++) c += uC[k].x * sin(uC[k].y * x + uC[k].z);
  for (int k = 0; k < ${NZ}; k++) z += uZ[k].x * sin(uZ[k].y * x + uZ[k].z);
  for (int k = 0; k < ${NW}; k++) w += uW[k].x * sin(uW[k].y * x + uW[k].z);
  for (int k = 0; k < ${NP}; k++) p += uP[k].x * sin(uP[k].y * x + uP[k].z);
  for (int k = 0; k < ${NR}; k++) r += uR[k].x * sin(uR[k].y * x + uR[k].z + uR[k].w * v);
  float s = (v - 0.5) * uW0 * w, sp = sin(p), cp = cos(p);
  return vec3(x, c + s * sp + r * cp, z + s * cp - r * sp);
}
// camera space (right, up, depth)
vec3 cam(vec3 q){ vec3 d = q - uCamPos; return vec3(dot(d, uCamR), dot(d, uCamU), dot(d, uCamF)); }
vec2 toPx(vec3 c){ vec2 q = uFocal * c.xy / max(c.z, 0.05); return vec2(uRes.x * 0.5 + q.x * uRes.y, uRes.y * 0.5 + q.y * uRes.y); }
void main(){
  int line = gl_InstanceID;
  int j = gl_VertexID >> 1;
  float side = float(gl_VertexID & 1) * 2.0 - 1.0;
  float fl = float(line);
  float v = (fl + 0.5 + (hash(fl + 1.0) - 0.5) * 0.6) / float(uLines);

pTheme.onchange = e => { state.theme = +e.target.value; };
document.getElementById('pSpeed').oninput = e => { state.speed = +e.target.value; };
document.getElementById('pScale').oninput = e => { state.scale = +e.target.value; };
document.getElementById('pPause').onchange = e => { state.paused = e.target.checked; };
if (params.get('panel') === '1') panel.style.display = 'block';
window.addEventListener('keydown', e => { if (e.key === 'p' || e.key === 'h')
  panel.style.display = panel.style.display === 'block' ? 'none' : 'block'; });
canvas.addEventListener('dblclick', () => { panel.style.display = panel.style.display === 'block' ? 'none' : 'block'; });

let simT = 0, last = performance.now(), frame = 0;
const allLayers = parseLayers(params.get('layers'));
function tick(now) {
  const dt = Math.min(0.25, Math.max(0, (now - last) / 1000)); last = now;
  if (!state.paused) simT += dt * state.speed;
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(canvas.clientWidth * dpr * state.scale));
  const h = Math.max(1, Math.round(canvas.clientHeight * dpr * state.scale));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ensureTargets(w, h, false);
  let tp = state.fixedTime ? state.fixedTime.slice() : nowParts();
  renderFrame({ timeParts: tp, theme: state.theme, seed: state.seed, t: simT,
                layers: allLayers, frameNo: frame++ }, null);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();
</script>
